const RARC=["#8fb4e0","#41e08a","#c07bff","#ffcc1f"];
function boxGlow(M){return M.best?RARC[M.best-1]:"#ffcc1f";}
function boxTap(){
  const M=UI.modal;if(!M||M.k!=="box")return;
  if(M.lock&&performance.now()<M.lock)return;
  if(M.phase==="drop")return;
  if(M.phase==="ready"){
    const need=CHESTS[M.tier].taps;M.taps++;
    const im=$(".boxov .chimg"),gl=$(".boxov .glow"),pips=document.querySelectorAll(".boxov .pips i");
    if(M.taps<need){
      sfx("tap"+Math.min(3,M.taps));hap(20+15*M.taps);
      if(im){im.style.setProperty("--k",M.taps);im.classList.remove("shk","drop");void im.offsetWidth;im.classList.add("shk");}
      /* luz por la ranura: nunca promete más de lo que hay */
      if(gl){const lv=Math.min(M.best,M.taps);gl.style.setProperty("--g",M.best?RARC[Math.max(0,lv-1)]:"#ffcc1f");gl.style.opacity=.25*M.taps+.15;}
      if(pips[M.taps-1])pips[M.taps-1].classList.add("on");
      if(im){const r=im.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height*.42,[boxGlow(M),"#fff"],8+8*M.taps,4+M.taps,.12);}
      return;
    }
    /* último toque: carga y apertura */
    M.phase="opening";if(pips[M.taps-1])pips[M.taps-1].classList.add("on");
    sfx("charge");hap(15);if(im){im.classList.remove("shk","drop");void im.offsetWidth;im.classList.add("charge");}
    if(gl){gl.style.setProperty("--g",boxGlow(M));gl.style.opacity=1;}
    setTimeout(()=>{
      S.box.splice(S.box.indexOf(M.tier),1);applyItems(M.items);
      screenFlash(M.best>=3?RARC[M.best-1]:"#fff",420,.95);sfx("burst");hap([40,30,60]);
      const c={x:innerWidth/2,y:innerHeight*.62};ring(c.x,c.y,boxGlow(M),320);burst(c.x,c.y,["#ffcc1f","#fff","#ffe9a0",boxGlow(M)],70,13,.2);
      M.phase="items";M.step=0;M.opened=true;renderModal();revealStep();
    },380);
    return;
  }
  if(M.phase==="items"){
    if(M.counting){UI.fast=true;return;}
    M.step++;
    if(M.step>=M.items.length){M.phase="sum";renderModal();sfx("ding");return;}
    renderModal();revealStep();return;
  }
  if(M.phase==="sum"){
    /* cerrar y que los recursos vuelen a la barra superior */
    const rects=[...document.querySelectorAll(".boxsum2 [data-k]")].map(e=>({k:e.dataset.k,n:+e.dataset.n,r:e.getBoundingClientRect()}));
    for(const x of rects)if(["coins","pp","gems"].includes(x.k))PEND[x.k]+=x.n;
    UI.modal=null;renderModal();UI.fast=false;
    if(S.box.length&&!M.direct&&UI.screen==="home"){for(const x of rects)if(PEND[x.k])PEND[x.k]-=x.n;openBox();return;}
    if(M.boxesAfter&&S.box.length){for(const x of rects)if(PEND[x.k])PEND[x.k]-=x.n;openBox();return;}
    refreshScreen();
    for(const x of rects)if(["coins","pp","gems"].includes(x.k)){PEND[x.k]-=x.n;flyRes(x.k,x.n,x.r);}
  }
}

let lastBuzz=0;
function hap(p){const t=performance.now();if(t-lastBuzz<60||!S.vib)return;lastBuzz=t;try{navigator.vibrate&&navigator.vibrate(p);}catch(e){}}
function arp(notes,step,type="triangle",vol=.08,d=.16,delay=0){notes.forEach((f,i)=>tone(f,d,type,vol,null,delay+i*step));}
function screenFlash(color="#fff",ms=380,op=.9){if(REDUCED)op*=.35;const e=document.createElement("div");e.className="sflash";e.style.cssText=`background:${color};--op:${op};animation-duration:${ms}ms`;document.body.appendChild(e);setTimeout(()=>e.remove(),ms);}
function ring(x,y,color="#ffe066",size=260,ms=520){if(REDUCED)return;const e=document.createElement("div");e.className="ring";e.style.cssText=`left:${x}px;top:${y}px;--c:${color};--s:${size}px;animation-duration:${ms}ms`;document.body.appendChild(e);setTimeout(()=>e.remove(),ms);}
const easeOut=t=>1-Math.pow(1-t,3);
/* contador que sube con tic de tono ascendente (un toque lo termina al momento: UI.fast) */
function countUp(el,from,to,ms=600,{tick=true,base=1100,prefix=""}={}){
  if(!el)return Promise.resolve();const steps=Math.min(24,Math.abs(to-from))||1,dt=ms/steps;
  return new Promise(res=>{let i=0;const iv=setInterval(()=>{i=UI.fast?steps:i+1;const v=Math.round(from+(to-from)*easeOut(i/steps));el.textContent=prefix+fmt(v);
    if(tick&&i%2===0&&!UI.fast)tone(base*Math.pow(2,(i/steps)*.6),.035,"square",.03);
    if(i>=steps){clearInterval(iv);el.classList.remove("cpop");void el.offsetWidth;el.classList.add("cpop");res();}},dt);});
}
const FLY_ICO={coins:"coin",pp:"power",gems:"gem",tk:"star"};
const FLY_DST={coins:"#coinsn",pp:"#ppn",gems:"#gemsn",tk:'.tabs [data-t="pass"]'};
const FLY_TICK={coins:i=>tone(1400*2**i,.04,"square",.035),pp:i=>tone(1100*2**i,.05,"sine",.05),gems:i=>tone(1600*2**i,.05,"sine",.05),tk:i=>tone(1318*2**i,.045,"sine",.045)};
function bumpEl(el){if(!el)return;el.classList.remove("bump");void el.offsetWidth;el.classList.add("bump");}
/* kind: coins|pp|gems|tk; n>0 gana (vuela a la barra superior), n<0 gasta (sale de la barra); from: elemento o rect */
function flyRes(kind,n,from){
  const dst=$(FLY_DST[kind]),pill=dst&&(dst.closest(".rpill")||dst);
  const shownVal=()=>kind==="tk"?0:(kind==="gems"?gems():S[kind])-(PEND[kind]||0);
  const settle=()=>{const d=$(FLY_DST[kind]);if(d&&d.id)d.textContent=fmt(shownVal());};
  const gain=n>0,a=Math.abs(n);
  if(gain&&kind!=="tk")PEND[kind]+=a;
  if(!pill||REDUCED||!from){if(gain&&kind!=="tk")PEND[kind]=Math.max(0,PEND[kind]-a);settle();bumpEl(pill);return Promise.resolve();}
  settle();
  const r0=from.getBoundingClientRect?from.getBoundingClientRect():from,x0=r0.left+r0.width/2,y0=r0.top+r0.height/2;
  const rd=(pill.querySelector(".ico")||pill.querySelector("img")||pill).getBoundingClientRect(),x1=rd.left+rd.width/2,y1=rd.top+rd.height/2;
  const k=Math.max(4,Math.min(14,Math.round(3*Math.log2(1+a/5))));
  const [sx,sy,ex,ey]=gain?[x0,y0,x1,y1]:[x1,y1,x0,y0];
  let layer=$("#fly");if(!layer){layer=document.createElement("div");layer.id="fly";document.body.appendChild(layer);}
  let landed=0,given=0;if(!gain){settle();bumpEl(pill);}
  return new Promise(done=>{
    for(let i=0;i<k;i++){
      const im=document.createElement("img");im.src=UIA+FLY_ICO[kind]+".webp";im.className="flyico";layer.appendChild(im);
      const ang=-Math.PI/2+(Math.random()-.5)*2.4,sp=gain?60+Math.random()*30:0,mx=sx+Math.cos(ang)*sp,my=sy+Math.sin(ang)*sp,
            cx=(mx+ex)/2+(Math.random()-.5)*120,cy=Math.min(my,ey)-80-Math.random()*60,pts=[];
      for(let s=1;s<=10;s++){const t=s/10,u=1-t;pts.push({x:u*u*mx+2*u*t*cx+t*t*ex,y:u*u*my+2*u*t*cy+t*t*ey,t});}
      const o0=gain?.25:.05;
      const kf=[{transform:`translate(${sx}px,${sy}px) scale(.4)`,opacity:0,offset:0},{transform:`translate(${mx}px,${my}px) scale(1.1)`,opacity:1,offset:o0},
        ...pts.map(p=>({transform:`translate(${p.x}px,${p.y}px) scale(${1.1-.55*p.t}) rotate(${p.t*(i%2?200:-200)}deg)`,offset:o0+p.t*(1-o0)}))];
      im.animate(kf,{duration:gain?600+Math.random()*150:350,delay:i*(gain?40:30),easing:"cubic-bezier(.55,0,.85,.35)",fill:"both"}).onfinish=()=>{
        im.remove();landed++;
        if(gain){const step=landed===k?a-given:Math.round(a/k);given+=step;if(kind!=="tk")PEND[kind]=Math.max(0,PEND[kind]-step);settle();bumpEl(pill);FLY_TICK[kind](landed/k*.5);if(landed===1||landed===k)hap(6);}
        else tone(500,.04,"triangle",.03);
        if(landed===k){if(gain){burst(x1,y1,kind==="pp"?["#c07bff","#fff"]:kind==="gems"?["#2ee87a","#fff"]:kind==="tk"?["#5fd8ff","#fff"]:["#ffcc1f","#fff"],8,2.5,-.02);tone(2093,.16,"sine",.06);const d=$(FLY_DST[kind]);if(d){d.classList.remove("cpop");void d.offsetWidth;d.classList.add("cpop");}}done();}
      };
    }
  });
}

const NET={ws:null,closing:false};
function netOpen(){
  return new Promise((res,rej)=>{
    if(NET.ws&&NET.ws.readyState===1)return res();
    let ws;try{ws=new WebSocket(SERVER?SERVER.replace(/^http/,"ws"):(location.protocol==="https:"?"wss://":"ws://")+location.host);}catch(e){return rej(e);}
    NET.closing=false;
    ws.onopen=()=>{NET.ws=ws;netSend({t:"hello",name:S.name,tro:S.tro,unl:S.unl});res();};
    ws.onerror=()=>rej(new Error("conexión"));
    ws.onclose=()=>{const was=NET.ws===ws;NET.ws=null;if(was&&!NET.closing)netLost();};
    ws.onmessage=e=>{let m;try{m=JSON.parse(e.data);}catch(err){return;}netMsg(m);};
  });
}
function netSend(o){if(NET.ws&&NET.ws.readyState===1)NET.ws.send(JSON.stringify(o));}
function netClose(){NET.closing=true;if(NET.ws){netSend({t:"leave"});NET.ws.close();}NET.ws=null;}
function netLost(){
  if(G&&G.online&&UI.screen!=="home"){stopLoop();R=null;UI.modal={k:"info",title:"Conexión perdida",text:"Se ha cortado la conexión con el servidor."};renderModal();}

}

  const left=Math.max(0,ROUND_T-now),ck=$("#clock");
  ck.textContent=R.sudden?"⚡ "+Math.ceil(left)+"s":Math.floor(left/60)+":"+String(Math.floor(left%60)).padStart(2,"0");ck.classList.toggle("sd",R.sudden);
  const e=R.elx.p;$("#elxn").textContent=Math.floor(e);
  document.querySelectorAll("#esegs i b").forEach((b,i)=>{b.style.width=Math.max(0,Math.min(1,e-i))*100+"%";});
  $("#esegs").classList.toggle("turbo",me.turboUntil>now);
  const bst=[];if(me.turboUntil>now)bst.push("⚡"+Math.ceil(me.turboUntil-now)+"s");if(me.shieldUntil>now)bst.push("🛡️");if(me.visionUntil>now)bst.push("👁");
  $("#bst").textContent=bst.join(" ");
  renderStatus();
}
function renderStatus(){
  const el=$("#status");if(!el||!R)return;
  if(R.over){el.innerHTML="";return;}
  const me=R.heroes.p,now=R.now;let t,c="";
  const danger=R.projs.some(p=>p.o==="b"&&p.warn&&inArea(p.cells,me.x,me.y));
  if(R.paused)t="⏳ ¡Prepárate!";
  else if(danger){t="⚠️ ¡Te van a dar! Toca otra casilla verde";c="warn";}
  else if(R.marks.b.some(m=>m.t==="hit"||m.t==="ping")||me.visionUntil>now){t="👀 ¡Rival a la vista! Dispara";c="good";}
  else if(R.marks.b.some(m=>m.t==="pick")){t="👀 ¡Cogió un objeto ahí!";c="good";}
  else if(R.marks.b.some(m=>m.t==="huella")){t="👣 ¡Ha disparado desde ahí!";c="good";}
  else if(R.marks.p.some(m=>(m.t==="huella"&&!m.fake)||m.t==="pick")){t="👣 ¡Te han visto! Cambia de sitio";c="bad";}
  else if(R.boosts.length)t="🎁 Objeto en el mapa: ¿cebo o premio?";
  else if(R.elx.p<HEROES[me.type].cost)t="💧 Cargando elixir…";
  else t="🎯 Busca al rival";
  const html=`<span class="${c}">${t}</span>`;if(el.innerHTML!==html)el.innerHTML=html;
}

/* ================= efectos ================= */
function toast(k,txt){
  if(S.tips[k])return;S.tips[k]=1;save();
  const old=$(".toast");if(old)old.remove();
  const e=document.createElement("div");e.className="toast";e.dataset.a="toast";e.innerHTML=txt;document.body.appendChild(e);
  setTimeout(()=>e.remove(),UI.screen==="game"?3200:5200);
}
const ui={
  fired(p){
    if(UI.screen!=="game")return;
    sfx("shoot");B3.fireFx(p.o,p);
    if(p.o==="p"){
      if(!HEROES[p.type].stealth)toast("myprint","👣 <b>Tu disparo te ha delatado.</b> El rival ve desde dónde. ¡Muévete!");
    }else{
      if(p.warn){toast("incoming","⚠️ <b>¡Te van a dar!</b> Las casillas que parpadean en tu isla verde van a recibir el golpe. Toca otra casilla para esquivar.");buzz(25);}
      if(p.hx!=null)toast("foeprint","👣 <b>¡El rival disparó desde ahí!</b> Contraataca rápido.");
    }
  },
  impact(p){
    if(UI.screen!=="game")return;
    B3.impactFx(p);
    const mine=p.o==="p",to=B3.areaScreen(p.d,p.cells);
    if(mine){
      if(p.res==="hit"){const ko=(p.vhp??R.heroes.b.hp)<=0,c=B3.screenPos("b",p.vx??0,p.vy??0,1);
        floatText(c.x,c.y,ko?"¡K.O.!":"¡TOCADO! −"+p.dmg,"big");sfx(ko?"kill":"hit");buzz(ko?[40,30,60]:40);}
      else if(p.res==="block"){floatText(to.x,to.y,"🛡️ ¡Bloqueado!","miss");sfx("miss");}
      else if(p.res==="near"){floatText(to.x,to.y,"¡CERCA! 🔥","near");sfx("near");toast("near","🔥 <b>¡CERCA!</b> El rival estaba justo al lado. ¡Remata!");}
      else{floatText(to.x,to.y,"AGUA","miss");sfx("miss");}
    }else{
      const c=B3.heroScreen(),ko=(p.vhp??R.heroes.p.hp)<=0;
      if(p.res==="hit"){floatText(c.x,c.y,ko?"K.O.":"−"+p.dmg,"bad");vignette();sfx(ko?"ko":"hurt");buzz(60);}
      else if(p.res==="block"){floatText(c.x,c.y,"🛡️ ¡Parado!","good");sfx("near");}
      else if(p.res==="near")floatText(to.x,to.y,"¡Uf! Por poco","miss");
    }
  },
  pickup(s,b){
    if(UI.screen!=="game")return;
    if(s==="p"){const c=B3.heroScreen();floatText(c.x,c.y,BOOSTS[b.k].i+" "+BOOSTS[b.k].d,"good");sfx("coin");sfx("near");buzz(20);
      B3.burst(B3.tileWorld("p",b.x,b.y).setY(.5),[0xffe25a,0xffffff],30,2,2.5,.12);
      toast("mypick","👀 <b>¡Ojo!</b> Al coger el objeto, el rival ha visto dónde estás.");}
    else{const c=B3.screenPos("b",b.x,b.y,.8);floatText(c.x,c.y,"👀 ¡Lo cogió!","near");sfx("radar");toast("foepick","👀 <b>¡El rival cogió el objeto!</b> Sabes que está ahí. ¡Dispara!");}
  },
  boost(){if(UI.screen!=="game")return;sfx("tap");toast("boost","🎁 <b>¡Objeto!</b> Sale en el mismo sitio en las dos islas. Si lo coges, el rival sabrá dónde estás.");},
  noElx(){const b=$("#ebar");if(b)shake(b);sfx("miss");toast("noelx","💧 <b>Sin elixir.</b> Espera un momento a que se recargue o coge un 💧.");},
  sudden(){banner("¡MUERTE SÚBITA!","Ataques sin aviso · os veréis cada 5 s","red",1500);},
  ping(){sfx("radar");},
  roundOver(w){endRound(w);},
};

/* ================= entrada ================= */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-a]");if(!el)return;
  const a=el.dataset.a;
  if(a==="mback"){if(e.target===el&&UI.modal&&["how","settings","name","mode","missions","calendar","info2","purchinfo","nogems","seasonnew","starter"].includes(UI.modal.k)){UI.modal=null;renderModal();}return;}
  if(a==="toast"){el.remove();return;}
  switch(a){
    case "play":sfx("tap");if(S.mode==="friends"){UI.modal={k:"friends",st:"menu"};renderModal();}else if(S.mode==="online")queueStart();else startMatch();break;
    case "qcancel":sfx("tap");queueStop();UI.modal=null;renderModal();break;
    case "qbot":sfx("tap");queueStop();UI.modal=null;renderModal();startMatch();break;
    case "home":sfx("tap");UI.modal=null;renderModal();if(G&&G.online)netClose();G=null;R=null;showHome();break;
    case "tab":sfx("tap");UI.modal=null;renderModal();({home:showHome,heroes:showHeroes,road:showRoad,shop:showShop,pass:showPass})[el.dataset.t]();break;
    case "upgrade":upgrade(el.dataset.id);break;
    case "offer":sfx("tap");buyOffer(el.dataset.id);break;
    case "buybox":sfx("tap");buyBox(+el.dataset.t);break;
    case "gift":sfx("tap");claimGift();break;
    case "pclaim":sfx("chest");passClaim(+el.dataset.i,el.dataset.tr);break;
    case "pclaimall":sfx("chest");UI.modal=null;renderModal();if(UI.screen!=="pass")showPass();passClaimAll();break;
    case "claimall":sfx("chest");claimAllRoad();break;
    case "mclaim":misClaim(+el.dataset.i,el.dataset.w==="1");break;
    case "reroll":reroll(+el.dataset.i);break;
    case "calendar":sfx("tap");UI.modal={k:"calendar"};renderModal();break;
    case "calclaim":sfx("chest");calClaim();break;
    case "comebackok":{const g=+el.dataset.g;S.back=g>=10?10:5;save();UI.modal=null;renderModal();const l=g>=30?[C_(3),{r:"hero"},T_("tk",1000)]:g>=10?[C_(3)]:[C_(2)];claimMany(l);break;}
    case "mclaimh":{const id=el.dataset.id,g=S.mgot[id]=S.mgot[id]||[];const l=[];MASTERY.forEach((m,i)=>{if((S.hw[id]||0)>=m.n&&!g.includes(i)){g.push(i);l.push(m.r);}});save();UI.modal=null;renderModal();claimMany(l);break;}
    case "equipskin":S.equip.skin[el.dataset.id]=el.dataset.s||"";save();sfx("sel");renderModal();if(UI.screen!=="game")refreshScreen();break;
    case "buyskin":sfx("tap");buySkin(el.dataset.s||el.dataset.id);break;
    case "buyhg":sfx("tap");buyHeroGems(el.dataset.id);break;
    case "gemitem":sfx("tap");buyGemItem(el.dataset.id);break;
    case "gemshop":sfx("tap");UI.modal=null;renderModal();showShop("gems");break;
    case "iap":sfx("tap");buyIAP(el.dataset.id);break;
    case "payok":{const M=UI.modal;UI.modal=null;renderModal();M.res({ok:true,sku:M.sku,tx:"test-"+Date.now()+"-"+rnd(1e6)});break;}
    case "paycancel":{const M=UI.modal;UI.modal=null;renderModal();M.res({ok:false,reason:"cancel"});break;}
    case "cgemsok":{const M=UI.modal;UI.modal=null;renderModal();M.onOk();break;}
    case "agesave":{const y=+($("#agesel")||{}).value;if(!y)break;const a=new Date().getFullYear()-y;S.age={band:a<13?"u13":a<18?"13-17":"18+",at:Date.now()};save();const M=UI.modal;UI.modal=null;renderModal();if(M.then)M.then();break;}
    case "premium":sfx("tap");UI.modal={k:"premium"};renderModal();break;
    case "passgems":confirmGems(450,"Pase Premium de la temporada",()=>{if(!spendGems(450))return;activatePremium(false);});break;
    case "nextprem":S.pass.nextPrem=true;save();UI.modal={k:"info2",title:"Hecho",html:"<p>Cuando lo compres, el Premium se aplicará a la temporada siguiente.</p>"};renderModal();break;
    case "skip":UI.modal={k:"info2",title:"Saltar escalones",html:`<p>Solo con Premium. Elige cuántos:</p><div style="display:flex;gap:8px;justify-content:center">${[1,5,10].map(n=>`<button class="gbtn premium sm" data-a="skipn" data-n="${n}">${n} · ${ico("gem","s")}${SKIP[n]}</button>`).join("")}</div>`};renderModal();break;
    case "skipn":skipTiers(+el.dataset.n);break;
    case "purchinfo":sfx("tap");UI.modal={k:"purchinfo"};renderModal();break;
    case "restore":sfx("tap");PAY.restore().then(l=>{UI.modal={k:"info2",title:"Restaurar compras",html:`<p>${l.length?`Compras encontradas: ${l.length}. Ya están aplicadas.`:"No hay compras que restaurar en este dispositivo."}</p>`};renderModal();});break;
    case "tvib":S.vib=S.vib?0:1;save();hap(30);renderModal();break;
    case "lvclose":if(UI.modal&&UI.modal.lock&&performance.now()<UI.modal.lock)break;sfx("tap");{const id=UI.modal.id;UI.modal={k:"heropage",id};renderModal();}break;
    case "arenaclose":el.remove();break;
    case "missions":sfx("tap");UI.modal={k:"missions"};renderModal();break;
    case "keysinfo":sfx("tap");keysInfo();break;
    case "openbox":openBox();break;
    case "boxtap":boxTap();break;
    case "buy":buy(el.dataset.id);break;
    case "settings":sfx("tap");UI.modal={k:"settings"};renderModal();break;
    case "tsnd":S.snd=S.snd?0:1;save();sfx("tap");renderModal();break;
    case "reset1":UI.modal.confirm=true;renderModal();break;
    case "reset0":UI.modal.confirm=false;renderModal();break;
    case "reset2":S=loadSaveFresh();save();UI.modal=null;showHome();break;
    case "close":sfx("tap");UI.modal=null;renderModal();break;
    case "name":sfx("tap");UI.modal={k:"name"};renderModal();break;
    case "namesave":{const v=($("#nameinp").value||"").replace(/[<>&"]/g,"").trim().slice(0,14);if(v){S.name=v;if(!S.gemOnce.name){S.gemOnce.name=1;addGems(10,false);}save();}UI.modal=null;renderModal();refreshScreen();break;}
    case "mode":sfx("tap");UI.modal={k:"mode"};renderModal();break;
    case "setdiff":S.diff=el.dataset.d;S.mode="bot";save();sfx("sel");renderModal();showHome();break;
    case "setmode":S.mode=el.dataset.m;save();sfx("sel");UI.modal=null;renderModal();showHome();break;
    case "hero":sfx("tap");UI.modal={k:"heropage",id:el.dataset.id};renderModal();break;
    case "fav":S.fav=el.dataset.id;save();sfx("sel");renderModal();refreshScreen();break;
    case "claim":sfx("chest");claim(+el.dataset.t);break;
    case "how":sfx("tap");UI.modal={k:"how",i:0};renderModal();break;
    case "hownext":sfx("tap");if(UI.modal.i<HOW.length-1){UI.modal.i++;renderModal();}else{UI.modal=null;renderModal();}break;
    case "chest":openBox();break;
    case "rok":sfx("tap");UI.modal=null;renderModal();refreshScreen();break;
    case "psel":sfx("sel");G.pickSel=el.dataset.id;showPick();break;
    case "fight":sfx("go");if(G.online){G.picked=true;netSend({t:"pick",hero:G.pickSel});showPick();}else startRound();break;
    case "netcreate":sfx("tap");netStart("create");break;
    case "netjoin":{const c=($("#codeinp").value||"").toUpperCase().replace(/[^A-Z]/g,"");if(c.length!==4){UI.modal.err="El código tiene 4 letras.";renderModal();break;}sfx("tap");netStart("join",c);break;}
    case "netcancel":netClose();UI.modal={k:"friends",st:"menu"};renderModal();break;
    case "copycode":{const c=UI.modal.code;try{navigator.clipboard.writeText(c).then(()=>floatText(innerWidth/2,innerHeight/2,"¡Copiado!","good"),()=>{});}catch(err){}break;}
    case "rematch":sfx("tap");netSend({t:"rematch"});{const m=$("#rematchmsg");if(m)m.textContent="Esperando a que tu rival acepte…";}break;
    case "netleave":sfx("tap");netClose();G=null;showHome();break;
  }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&UI.modal){if(UI.modal.k==="name")$("[data-a=namesave]")?.click();if(UI.modal.k==="friends"&&$("#codeinp")===document.activeElement)$("[data-a=netjoin]")?.click();}
});
function loadSaveFresh(){try{localStorage.removeItem(SAVE_KEY);}catch(e){}return loadSave();}
function refreshScreen(){({home:showHome,heroes:showHeroes,road:showRoad,shop:showShop,pass:showPass})[UI.screen]?.();}
function onTile(b,x,y){
  if(!R||R.paused||R.over)return;
  const me=R.heroes.p,H=HEROES[me.type];
  if(b==="p"){
    AMAGO.moveTo(R,"p",x,y);sfx("sel");
    if(G.online){G.lastMove=R.now;netSend({t:"move",x,y});}
    renderLive();return;
  }
  if(G.online){
    if(R.elx.p<H.cost){ui.noElx();const c=B3.screenPos("b",x,y);floatText(c.x,c.y,`Faltan ${Math.ceil(H.cost-R.elx.p)} 💧`,"miss");return;}
    if(R.now<me.cdUntil)return;
    netSend({t:"fire",x,y});return;
  }
  const r=AMAGO.fire(R,"p",x,y,ui);
  if(r==="elx"){ui.noElx();const c=B3.screenPos("b",x,y);floatText(c.x,c.y,`Faltan ${Math.ceil(H.cost-R.elx.p)} 💧`,"miss");}
  else if(r==="ok")renderLive();
}
document.addEventListener("visibilitychange",()=>{lastT=performance.now();});

fxInit();
function bootGame(){
  if(GFX){try{GFX.bakePortraits();}catch(e){console.warn("Sin retratos 3D",e);}}
  if(!B3){app.innerHTML=`<div class="sheet" style="margin:auto"><h2 class="out">AMAGO</h2><p>Tu navegador no puede mostrar gráficos 3D (WebGL). Prueba con Chrome, Safari o Edge actualizados.</p></div>`;}
  else showHome();
  if(S.games===0&&!S.tips.welcome){S.tips.welcome=1;save();UI.modal={k:"how",i:0};renderModal();}
}
if(GFX){app.innerHTML=`<div class="mbg"></div><div class="loading"><div class="logo2">AMAGO</div><div class="lbar"><u></u></div><p class="sub">Preparando la arena…</p></div>`;{const all=Promise.all([GFX.loadSprites(),GFX.loadAnim3d([S.fav]),SHOW?SHOW.preload(S.fav):0,GFX.loadProps(),GFX.loadArena(arenaOf(S.tro).a.k)]);let booted=false,late=false;
  Promise.race([all,new Promise(r=>setTimeout(()=>{late=true;r();},45000))]).then(()=>{booted=true;bootGame();});
  /* si la conexión es lenta y los modelos llegan después, se cambian al momento */
  all.then(()=>setTimeout(()=>GFX.loadAnim3d(S.unl),1200));/* tus héroes, en segundo plano */
  all.then(()=>{if(late&&booted){try{GFX.bakePortraits();}catch(e){}if(UI.screen!=="game"&&UI.screen!=="pick")refreshScreen();}});}}
else bootGame();
