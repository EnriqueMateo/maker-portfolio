<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--ARTIFACT-START-->
<title>AMAGO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap">
<style>
/* Layout: juego móvil vertical. Inicio con héroes en escena; partida con tablero rival arriba, el tuyo abajo y un dock de acción al pie */
:root{
  --bg:#141846; --bg2:#0a0c27; --panel:#1d2260; --panel2:#2a3185; --ink:#0b0a1f;
  --fg:#ffffff; --muted:#aab2e6;
  --me:#34c6ff; --me-d:#1673c9; --foe:#ff4d6d; --foe-d:#a3123a;
  --gold:#ffcc1f; --gold-d:#c98400; --ok:#41e08a; --fire:#ff8a1f;
  --f-game:"Lilita One", "Arial Black", Impact, system-ui, sans-serif;
  --f-body:"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --c:clamp(36px, min(14vw, 5svh), 62px); --g:5px; --pad:8px;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 70% at 50% 0%,#2b358d 0%,var(--bg) 50%,var(--bg2) 100%) fixed,var(--bg2);color:var(--fg);font-family:var(--f-body);font-weight:800;font-size:15px;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;overflow-x:hidden}
#app.center{justify-content:center}
#app{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:8px 14px;min-height:100%;display:flex;flex-direction:column;gap:8px;box-sizing:border-box}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.out{text-shadow:0 3px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink),2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink)}

/* botones de juego */
.gbtn{font-family:var(--f-game);font-size:24px;letter-spacing:.03em;color:var(--ink);background:linear-gradient(#ffe25a,var(--gold));border:3px solid var(--ink);border-radius:16px;box-shadow:0 6px 0 var(--gold-d),0 6px 0 3px var(--ink);padding:12px 18px;cursor:pointer;transition:transform .08s,box-shadow .08s;display:flex;flex-direction:column;align-items:center;line-height:1}
.gbtn small{font-family:var(--f-body);font-size:12px;font-weight:900;opacity:.75;margin-top:3px;letter-spacing:0}
.gbtn:active:not(:disabled){transform:translateY(5px);box-shadow:0 1px 0 var(--gold-d),0 1px 0 3px var(--ink)}
.gbtn:disabled{filter:grayscale(.8) brightness(.7);cursor:default}
.gbtn.red{background:linear-gradient(#ff7b93,var(--foe));box-shadow:0 6px 0 var(--foe-d),0 6px 0 3px var(--ink);color:#fff}
.gbtn.red:active:not(:disabled){box-shadow:0 1px 0 var(--foe-d),0 1px 0 3px var(--ink)}
.gbtn.blue{background:linear-gradient(#7ddcff,var(--me));box-shadow:0 6px 0 var(--me-d),0 6px 0 3px var(--ink)}
.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.04)}}
.pillbtn{background:var(--panel);border:3px solid var(--ink);border-radius:999px;padding:8px 16px;cursor:pointer;box-shadow:0 4px 0 var(--ink);font-weight:900}
.pillbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.iconbtn{width:42px;height:42px;border-radius:12px;background:var(--panel);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);cursor:pointer;font-size:20px}

/* inicio */
.topbar{display:flex;align-items:center;gap:10px}
.tro{flex:1;display:flex;align-items:center;gap:8px;background:var(--panel);border:3px solid var(--ink);border-radius:14px;padding:6px 10px;box-shadow:0 4px 0 var(--ink)}
.tro .ic{font-size:24px}
.tro b{font-family:var(--f-game);font-size:22px;font-weight:400}
.tro .ar{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.tro small{font-size:11px;color:var(--muted)}
.bar{height:8px;border-radius:4px;background:var(--ink);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#fff07a);border-radius:4px}
.logo{font-family:var(--f-game);font-size:clamp(64px,22vw,96px);text-align:center;line-height:.9;margin:6px 0 0;letter-spacing:.02em}
.logo .go{color:var(--foe)}
.slogan{text-align:center;color:var(--muted);margin:0;font-size:14px}
.stage{position:relative;display:flex;justify-content:center;align-items:flex-end;gap:4px;padding:14px 0 18px;cursor:pointer;background:none;border:0}
.stage::after{content:"";position:absolute;left:8%;right:8%;bottom:6px;height:28px;border-radius:50%;background:radial-gradient(closest-side,#4d5ad8,transparent);opacity:.7;z-index:-1}
.hst{display:flex;flex-direction:column;align-items:center;gap:2px}
.hst .bob{width:min(28vw,118px);height:min(28vw,118px)}
.hst:nth-child(2) .bob{width:min(32vw,134px);height:min(32vw,134px)}
.hst b{font-family:var(--f-game);font-weight:400;font-size:16px}
.bob{animation:bob 1.6s ease-in-out infinite}
.hst:nth-child(2) .bob{animation-delay:-.5s}.hst:nth-child(3) .bob{animation-delay:-1s}
@keyframes bob{50%{transform:translateY(-6px) scale(1.02,.98)}}
.play{font-size:34px;padding:16px;width:100%}
.homerow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.chestbtn{display:flex;align-items:center;gap:10px;background:linear-gradient(#5a3fb8,#3a2a8a);border:3px solid var(--ink);border-radius:16px;padding:8px 14px;box-shadow:0 5px 0 var(--ink);cursor:pointer;position:relative;animation:glow 1.4s ease-in-out infinite alternate}
.chestbtn svg{width:56px;height:46px}
.chestbtn span{font-size:15px;text-align:left}
.chestbtn i{position:absolute;top:-8px;right:-8px;background:var(--foe);border:2px solid var(--ink);border-radius:999px;font-style:normal;padding:0 7px;font-size:13px}
@keyframes glow{to{box-shadow:0 5px 0 var(--ink),0 0 22px #a98bff}}

/* hud de partida */
.ghud{display:flex;align-items:center;gap:8px}
.side{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.side.foe{align-items:flex-end;text-align:right}
.side .nm{font-family:var(--f-game);font-weight:400;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.side.me .nm{color:var(--me)} .side.foe .nm{color:var(--foe)}
.stars{display:flex;gap:2px;font-size:16px}
.stars .on{color:var(--gold);filter:drop-shadow(0 0 4px var(--gold))} .stars .off{color:#3a4185}
.tbox{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:96px}
.tbox .t{font-family:var(--f-game);font-weight:400;font-size:15px;background:var(--panel);border:3px solid var(--ink);border-radius:10px;padding:2px 10px}
.tbar{width:100%;height:7px;border-radius:4px;background:var(--ink);overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:var(--me);transform-origin:left}
.tbar.low i{background:var(--foe)}

/* tableros */
.bwrap{position:relative;align-self:center;border-radius:20px;padding:var(--pad);border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink)}
.bwrap.me{background:linear-gradient(#1f4c9e,#163877);margin-top:8px}
.bwrap.foe{background:linear-gradient(#5a1c45,#33102b);margin-top:10px}
.bwrap.aiming{box-shadow:0 5px 0 var(--ink),0 0 0 3px var(--foe),0 0 24px var(--foe)}
.ribbon{position:absolute;top:-13px;left:50%;transform:translateX(-50%);font-family:var(--f-game);font-weight:400;padding:2px 14px;border-radius:999px;border:3px solid var(--ink);font-size:14px;letter-spacing:.06em;z-index:5;white-space:nowrap}
.ribbon.me{background:var(--me);color:var(--ink)} .ribbon.foe{background:var(--foe)}
.board{position:relative;display:grid;grid-template-columns:repeat(5,var(--c));grid-auto-rows:var(--c);gap:var(--g)}
.tile{position:relative;border-radius:11px;border:0;padding:0;cursor:pointer;display:grid;place-items:center;overflow:visible}
.me .tile{background:linear-gradient(#3a7ad6,#2b62b8);box-shadow:inset 0 -5px 0 rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.18)}
.foe .tile{background:radial-gradient(60% 50% at 30% 30%,rgba(255,255,255,.10),transparent 70%),radial-gradient(50% 45% at 75% 70%,rgba(255,255,255,.07),transparent 70%),linear-gradient(#7a2a5c,#5b1d45);box-shadow:inset 0 -5px 0 rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.12)}
.tile .tc{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.tile.mv{background:linear-gradient(#8fe3ff,#4cc3ff)!important;animation:mvglow .8s ease-in-out infinite alternate}
.tile.mv::after{content:"";width:30%;height:30%;border-radius:50%;background:#fff;opacity:.85;box-shadow:0 0 10px #fff}
@keyframes mvglow{to{filter:brightness(1.15)}}
.tile.aim:hover{filter:brightness(1.35)}
.tile.zone{background:linear-gradient(#ff7b93,#ff4d6d)!important;box-shadow:inset 0 -5px 0 rgba(0,0,0,.25),0 0 14px var(--foe)}
.tile.zone::before{content:"";position:absolute;inset:22%;border:3px solid #fff;border-radius:50%;opacity:.9}
.tile.ghost{outline:3px dashed #fff;outline-offset:-3px}
.tile.firein{background:repeating-linear-gradient(-45deg,#ff9a3d 0 8px,#d9540f 8px 16px)!important;animation:firein .6s ease-in-out infinite alternate}
@keyframes firein{to{filter:brightness(1.25)}}
.tile.fireout{box-shadow:0 0 0 3px var(--fire),0 0 14px var(--fire)}
.tile.near{background:radial-gradient(circle,#ffb347,#c2410c)!important}
.tile.boom{animation:boom .5s ease-out}
@keyframes boom{0%{filter:brightness(3);transform:scale(1.12)}100%{filter:none;transform:none}}
.tile.scan{animation:scan .6s ease-out}
@keyframes scan{0%{filter:brightness(2) hue-rotate(-120deg)}100%{filter:none}}
.mk{width:72%;height:72%;position:relative;display:grid;place-items:center}
.mk svg{width:100%;height:100%}
.mk.old{opacity:.4}
.mk .bdg{position:absolute;right:-6px;bottom:-6px;font-size:15px;filter:drop-shadow(0 1px 0 var(--ink))}
.mk.dead svg{filter:grayscale(1) brightness(.6)}
.mk.pop{animation:mkpop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes mkpop{0%{transform:scale(0)}100%{transform:scale(1)}}
.fp{width:62%;height:62%;filter:drop-shadow(0 0 6px var(--foe))}
.fp.old{opacity:.35;filter:none}
.fp.fake{filter:drop-shadow(0 0 6px #c07bff)}
.water{width:30%;height:30%;border-radius:50%;border:3px solid rgba(255,255,255,.35)}
.flame{font-size:calc(var(--c)*.45)}
.wico{font-size:calc(var(--c)*.42);opacity:.95}
.toks{position:absolute;left:var(--pad);top:var(--pad);width:0;height:0}
.tok{position:absolute;left:0;top:0;width:var(--c);height:var(--c);transform:translate(calc(var(--x) * (var(--c) + var(--g))),calc(var(--y) * (var(--c) + var(--g))));transition:transform .34s cubic-bezier(.3,1.4,.5,1);cursor:pointer;z-index:2;background:none;border:0;padding:0}
.tok .bob{width:100%;height:100%}
.tok .ring{position:absolute;left:12%;right:12%;bottom:2%;height:18%;border-radius:50%;background:rgba(0,0,0,.35)}
.tok.sel .ring{background:var(--gold);box-shadow:0 0 12px var(--gold)}
.tok.sel .bob{animation:bob .7s ease-in-out infinite}
.tok.dim{filter:saturate(.6) brightness(.8)}
.tok.planned{opacity:.55}
.tok .hpb{position:absolute;top:-4px;left:50%;transform:translateX(-50%);display:flex;gap:2px}
.tok .hpb i{width:8px;height:8px;border-radius:50%;background:var(--ok);border:2px solid var(--ink)}
.tok .hpb i.off{background:#444a7a}
.tok .cd{position:absolute;top:-6px;right:-4px;background:var(--ink);border-radius:999px;font-size:11px;padding:1px 4px;color:var(--gold)}
.tok .seen{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);background:var(--foe);border:2px solid var(--ink);border-radius:999px;font-size:9px;padding:0 4px;white-space:nowrap;font-family:var(--f-body);font-weight:900;animation:pulse .8s infinite}
.tok.hit{animation:tokhit .45s}
@keyframes tokhit{20%{filter:brightness(3) sepia(1) hue-rotate(-50deg)}40%{transform:translate(calc(var(--x) * (var(--c) + var(--g)) - 5px),calc(var(--y) * (var(--c) + var(--g))))}70%{transform:translate(calc(var(--x) * (var(--c) + var(--g)) + 5px),calc(var(--y) * (var(--c) + var(--g))))}}
.tok.ko{transition:transform .6s,opacity .6s;opacity:0;filter:grayscale(1)}
.tok.foe .ring{background:var(--foe);box-shadow:0 0 10px var(--foe)}
.tok.reveal{animation:mkpop .4s cubic-bezier(.3,1.6,.5,1)}

/* estado y dock */
.status{min-height:26px;display:flex;justify-content:center;align-items:center;text-align:center;font-size:15px}
.status span{background:var(--panel);border:3px solid var(--ink);border-radius:999px;padding:3px 12px}
.status .warn{background:#5b3608;color:#ffd38a} .status .bad{background:#5a1023;color:#ffb3c1} .status .good{background:#0f4a33;color:#9ff5c8}
.dock{background:linear-gradient(var(--panel2),var(--panel));border:3px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:150px;box-sizing:border-box}
.drow{display:flex;gap:8px;align-items:center}
.hbtn{position:relative;width:52px;height:52px;border-radius:14px;border:3px solid var(--ink);background:#2f388f;padding:2px;cursor:pointer;flex:none}
.hbtn.on{background:var(--gold);box-shadow:0 0 12px var(--gold)}
.hbtn .cd{position:absolute;bottom:-6px;right:-6px;background:var(--ink);color:var(--gold);border-radius:999px;font-size:11px;padding:1px 5px}
.hinfo{flex:1;min-width:0;display:flex;gap:8px;align-items:center}
.hinfo b{font-family:var(--f-game);font-weight:400;font-size:17px;display:block}
.hinfo small{display:block;color:var(--muted);font-size:12px;line-height:1.25}
.pat{display:grid;grid-template-columns:repeat(3,9px);gap:2px;flex:none;padding:4px;background:var(--ink);border-radius:6px}
.pat i{width:9px;height:9px;border-radius:2px;background:#3a4185}
.pat i.on{background:var(--foe)}
.pat.scan i.on{background:var(--me)}
.radar{position:relative;width:56px;height:56px;border-radius:50%;border:3px solid var(--ink);background:conic-gradient(var(--ok) calc(var(--p)*1%),#2f388f 0);cursor:pointer;flex:none;display:grid;place-items:center;font-size:24px;box-shadow:0 4px 0 var(--ink)}
.radar span{width:42px;height:42px;border-radius:50%;background:var(--panel);display:grid;place-items:center}
.radar.full{animation:radar 1s ease-in-out infinite}
.radar.full span{background:var(--ok)}
@keyframes radar{50%{box-shadow:0 4px 0 var(--ink),0 0 22px var(--ok);transform:scale(1.06)}}
.radar:disabled{cursor:default}
.hint{font-size:14px;text-align:center;color:var(--muted);min-height:20px}
.hint b{color:var(--fg)}
.hint .r{color:#ff9db0} .hint .bl{color:#8fe3ff}
.gorow{display:flex;gap:8px}
.gorow .gbtn{flex:1;font-size:24px;padding:10px}
.passbtn{background:none;border:3px solid var(--ink);border-radius:14px;background:var(--panel);padding:0 12px;cursor:pointer;color:var(--muted)}

/* capas de efectos */
#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
.proj{position:fixed;left:0;top:0;width:0;height:0;z-index:55;pointer-events:none}
.proj>*{position:absolute;transform:translate(-50%,-50%)}
.orb{width:22px;height:22px;border-radius:50%;box-shadow:0 0 16px 6px currentColor}
.ftxt{position:fixed;z-index:70;pointer-events:none;font-family:var(--f-game);font-weight:400;font-size:26px;white-space:nowrap;transform:translate(-50%,-50%);animation:ftxt 1.2s ease-out forwards}
.ftxt.big{font-size:34px;color:var(--gold)} .ftxt.near{color:#ffb347} .ftxt.miss{color:#bfe6ff;font-size:20px} .ftxt.bad{color:var(--foe)} .ftxt.good{color:var(--ok)}
@keyframes ftxt{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}30%{transform:translate(-50%,-70%) scale(1)}100%{opacity:0;transform:translate(-50%,-160%)}}
.banner{position:fixed;left:0;right:0;top:38%;z-index:80;display:flex;flex-direction:column;align-items:center;pointer-events:none;animation:ban var(--d,1.4s) ease-in-out forwards}
.banner b{font-family:var(--f-game);font-weight:400;font-size:clamp(40px,13vw,64px);line-height:1;text-align:center}
.banner span{margin-top:6px;font-size:16px;background:var(--ink);padding:4px 12px;border-radius:999px}
.banner.gold b{color:var(--gold)} .banner.red b{color:var(--foe)} .banner.blue b{color:var(--me)}
@keyframes ban{0%{opacity:0;transform:scale(2.2)}12%{opacity:1;transform:scale(.95)}18%{transform:scale(1)}82%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.8)}}
.vign{position:fixed;inset:0;z-index:50;pointer-events:none;background:radial-gradient(transparent 50%,rgba(255,40,70,.55));opacity:0;animation:vign .6s ease-out}
@keyframes vign{20%{opacity:1}100%{opacity:0}}
.coach{position:fixed;left:50%;bottom:calc(196px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(420px,calc(100% - 32px));z-index:45;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:16px;padding:10px 14px;font-size:15px;box-shadow:0 5px 0 var(--ink);cursor:pointer;animation:coach .35s cubic-bezier(.3,1.5,.5,1)}
.coach::after{content:"";position:absolute;left:50%;bottom:-12px;width:18px;height:18px;background:#fff;border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
.coach.up{bottom:auto;top:calc(var(--top,120px))}
.coach.up::after{bottom:auto;top:-12px;transform:translateX(-50%) rotate(-135deg)}
.coach small{display:block;color:#5a5f8a;font-size:11px;margin-top:2px}
@keyframes coach{from{transform:translateX(-50%) scale(.6);opacity:0}}

/* ventanas */
.modal{position:fixed;inset:0;z-index:90;background:rgba(6,8,30,.82);display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
.sheet{width:100%;max-width:440px;max-height:100%;overflow:auto;background:linear-gradient(var(--panel2),var(--panel));border:3px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);padding:16px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;animation:coach .3s cubic-bezier(.3,1.4,.5,1)}
.sheet h2{margin:0;font-family:var(--f-game);font-weight:400;font-size:28px;text-align:center}
.sheet p{margin:0;text-align:center;color:var(--muted)}
.hgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.hcard{position:relative;background:var(--bg);border:3px solid var(--ink);border-radius:16px;padding:8px;cursor:pointer;display:flex;gap:8px;align-items:center;text-align:left;box-shadow:0 4px 0 var(--ink)}
.hcard .pt{width:56px;height:56px;flex:none}
.hcard b{font-family:var(--f-game);font-weight:400;font-size:17px;display:block}
.hcard small{display:block;font-size:11px;color:var(--muted);line-height:1.2}
.hcard .rar{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.06em}
.hcard.on{border-color:var(--gold);box-shadow:0 4px 0 var(--ink),0 0 0 2px var(--gold)}
.hcard .num{position:absolute;top:-8px;left:-8px;width:24px;height:24px;border-radius:50%;background:var(--gold);color:var(--ink);border:3px solid var(--ink);display:grid;place-items:center;font-size:12px}
.hcard.lock{cursor:default}
.hcard.lock .pt{filter:brightness(0) opacity(.6)}
.hcard.lock::after{content:"🔒";position:absolute;left:26px;top:22px;font-size:20px}
.howc{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:6px}
.howc .big{font-size:56px;line-height:1}
.howc h3{margin:0;font-family:var(--f-game);font-weight:400;font-size:24px}
.howc p{font-size:16px;color:var(--fg)}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:9px;height:9px;border-radius:50%;background:#3a4185}.dots i.on{background:var(--gold)}
.toggle{display:flex;justify-content:space-between;align-items:center;background:var(--bg);border:3px solid var(--ink);border-radius:14px;padding:10px 12px;cursor:pointer}
.toggle i{font-style:normal;padding:3px 12px;border-radius:999px;background:#3a4185}
.toggle i.on{background:var(--ok);color:var(--ink)}
.vs{display:flex;align-items:center;justify-content:space-around;gap:10px}
.vs .p{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.vs .p b{font-family:var(--f-game);font-weight:400;font-size:20px}
.vs .p small{color:var(--muted)}
.vs .mid{font-family:var(--f-game);font-size:48px;color:var(--gold)}

<script>
"use strict";
/* ================= datos ================= */
const N=5, D4=[[1,0],[-1,0],[0,1],[0,-1]], SIDES=["p","b"], O="#0b0a1f";
const ELX_MAX=10, ELX_START=5, ROUND_T=90, SUDDEN_T=60, HUELLA_T=2, MARK_T=1.3;

  truco:{n:"Truco",r:"Zorro",rar:1,hp:3,step:.28,mc:1,pat:"row3",cost:3,dmg:1,travel:.7,warn:true,fake:true,d:"Su huella sale en una casilla falsa.",c:"#ff9a2e",l:"#ffcb8f",dk:"#b85a00",proj:"arrow"},

const ARENAS=[{t:0,n:"Arena Aprendiz"},{t:100,n:"Bosque Cazador"},{t:250,n:"Volcán Estratega"},{t:500,n:"Trono de Leyendas"},{t:900,n:"Olimpo del Amago"}];
const NAMES=["LoboSolar","Nacho_77","PixelKing","Mr.Taco","ZetaGamer","Kira09","ElPeque","Rayito_x","DonPatata","LaReina","NinjaMiau","Turbo_Ale","Chispa","Bruma_33","CapitánNube"];
const HOW=[
  {i:"🙈",h:"Uno contra uno, a ciegas",p:"Tu héroe está abajo. El del rival, arriba y escondido. Sin turnos: todo pasa en tiempo real."},
  {i:"💧",h:"Todo cuesta elixir",p:"Moverte y disparar gasta elixir. Se recarga solo. Toca tu tablero para moverte y el rojo para disparar."},
  {i:"👣",h:"Disparar te delata",p:"Cuando disparas, el rival ve desde dónde. ¡Después escapa!"},
  {i:"🎁",h:"Objetos cebo",p:"Salen en el mismo sitio para los dos. Si lo coges, el rival sabrá dónde estás."},
  {i:"🏆",h:"3 rondas, 3 héroes",p:"Antes de cada ronda eliges héroe. No puedes repetir. Gana quien se lleve 2 rondas."},
];
const speedLabel=st=>st<=.22?"Muy rápido":st<=.32?"Rápido":st<=.42?"Normal":"Lento";

/* ================= utilidades ================= */
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};
const key=(x,y)=>x+","+y;
const inB=(x,y)=>x>=0&&y>=0&&x<N&&y<N;
const other=s=>s==="p"?"b":"p";
const clone=o=>JSON.parse(JSON.stringify(o));
const grid=v=>Array.from({length:N},()=>Array(N).fill(v));
const inArea=(cells,x,y)=>cells.some(([a,b])=>a===x&&b===y);
const sleep=ms=>new Promise(r=>setTimeout(r,REDUCED?Math.min(ms,60):ms));
const REDUCED=matchMedia("(prefers-reduced-motion: reduce)").matches;
const $=s=>document.querySelector(s);
const allCells=()=>{const c=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++)c.push([x,y]);return c;};

/* ================= guardado ================= */
const SAVE_KEY="amago-v3";
const DEF={tro:0,unl:["flecha","brasa","sombra","muro"],team:["flecha","brasa","sombra"],chests:0,tips:{},snd:1,tmr:1,games:0,wins:0};
function loadSave(){try{const s=JSON.parse(localStorage.getItem(SAVE_KEY)||"null");return Object.assign(clone(DEF),s||{});}catch(e){return clone(DEF);}}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(S));}catch(e){}}
let S=loadSave();

/* ================= sonido ================= */
const AU={ctx:null};
function actx(){if(!S.snd)return null;try{if(!AU.ctx)AU.ctx=new (window.AudioContext||window.webkitAudioContext)();if(AU.ctx.state==="suspended")AU.ctx.resume();return AU.ctx;}catch(e){return null;}}
function tone(f,d,type="sine",vol=.12,to=null,delay=0){
  const c=actx();if(!c)return;const t=c.currentTime+delay;
  const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+0.02);
}
function noise(d,vol=.2,freq=800,delay=0){
  const c=actx();if(!c)return;const t=c.currentTime+delay;
  const b=c.createBuffer(1,Math.floor(c.sampleRate*d),c.sampleRate),ch=b.getChannelData(0);
  for(let i=0;i<ch.length;i++)ch[i]=(Math.random()*2-1)*(1-i/ch.length);
  const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();
  s.buffer=b;f.type="lowpass";f.frequency.value=freq;g.gain.value=vol;
  s.connect(f).connect(g).connect(c.destination);s.start(t);
}
function sfx(n){
  if(!S.snd)return;
  switch(n){
    case "tap":tone(700,.05,"triangle",.07);break;
    case "sel":tone(520,.09,"triangle",.1,820);break;
    case "aim":tone(880,.06,"square",.04,1200);break;
    case "go":tone(392,.08,"square",.06);tone(587,.12,"square",.06,null,.07);break;
    case "whoosh":noise(.22,.12,1800);break;
    case "shoot":noise(.12,.1,3000);tone(900,.12,"triangle",.05,400);break;
    case "hit":noise(.35,.35,900);tone(160,.3,"sine",.3,45);break;
    case "kill":noise(.4,.35,900);tone(140,.35,"sine",.3,40);[523,659,784,1046].forEach((f,i)=>tone(f,.14,"triangle",.1,null,.12+i*.07));break;
    case "near":tone(988,.1,"triangle",.1);tone(1318,.14,"triangle",.1,null,.09);break;
    case "miss":tone(520,.25,"sine",.08,170);break;
    case "hurt":tone(260,.3,"sawtooth",.09,80);noise(.25,.2,500);break;
    case "ko":tone(300,.6,"sawtooth",.1,60);noise(.5,.25,400);break;
    case "radar":tone(300,.45,"sine",.12,1600);tone(1600,.1,"triangle",.06,null,.45);break;
    case "fire":noise(.6,.2,500);tone(200,.5,"sawtooth",.05,90);break;
    case "banner":tone(392,.12,"square",.05);tone(523,.16,"square",.05,null,.1);break;
    case "win":[523,659,784,1046,784,1046].forEach((f,i)=>tone(f,.2,"triangle",.12,null,i*.11));break;
    case "lose":[392,330,262,196].forEach((f,i)=>tone(f,.25,"triangle",.1,null,i*.15));break;
    case "tick":tone(1200,.04,"square",.04);break;
    case "coin":tone(1400,.05,"square",.04);tone(1900,.06,"square",.04,null,.04);break;
    case "chest":noise(.12,.25,300);tone(180,.12,"square",.08);break;
    case "open":tone(330,.7,"triangle",.12,1800);[1046,1318,1568,2093].forEach((f,i)=>tone(f,.18,"sine",.07,null,.5+i*.08));break;
  }
}
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms);}catch(e){}};

/* ================= partículas ================= */
const FX={cv:null,cx:null,ps:[],on:false};
function fxInit(){FX.cv=$("#fx");FX.cx=FX.cv.getContext("2d");const r=()=>{FX.dpr=Math.min(2,devicePixelRatio||1);FX.cv.width=innerWidth*FX.dpr;FX.cv.height=innerHeight*FX.dpr;};r();addEventListener("resize",r);}
function burst(x,y,colors,n=24,sp=6,grav=.18){
  if(REDUCED)return;
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=sp*(.4+Math.random());FX.ps.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2,g:grav,life:1,dec:.015+Math.random()*.02,s:3+Math.random()*5,c:pick(colors),rect:Math.random()<.5,rot:Math.random()*6});}
  if(!FX.on){FX.on=true;requestAnimationFrame(fxLoop);}
}
function confetti(){for(let i=0;i<5;i++)setTimeout(()=>burst(innerWidth*(.15+Math.random()*.7),innerHeight*.3,["#ffcc1f","#ff4d6d","#34c6ff","#41e08a","#c07bff","#fff"],40,9,.22),i*140);}
function fxLoop(){
  const c=FX.cx,d=FX.dpr;c.clearRect(0,0,FX.cv.width,FX.cv.height);
  FX.ps=FX.ps.filter(p=>p.life>0);
  for(const p of FX.ps){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.vx*=.98;p.life-=p.dec;p.rot+=.2;
    c.globalAlpha=Math.max(0,p.life);c.fillStyle=p.c;
    if(p.rect){c.save();c.translate(p.x*d,p.y*d);c.rotate(p.rot);c.fillRect(-p.s*d/2,-p.s*d/4,p.s*d,p.s*d/2);c.restore();}
    else{c.beginPath();c.arc(p.x*d,p.y*d,p.s*d/2,0,Math.PI*2);c.fill();}}
  c.globalAlpha=1;
  if(FX.ps.length)requestAnimationFrame(fxLoop);else FX.on=false;
}
function floatText(x,y,txt,cls=""){const e=document.createElement("div");e.className="ftxt out "+cls;e.textContent=txt;e.style.left=x+"px";e.style.top=y+"px";document.body.appendChild(e);setTimeout(()=>e.remove(),1300);}

}

const blob=(id)=>`<ellipse cx="50" cy="60" rx="33" ry="30" fill="url(#hg-${id})" stroke="${O}" stroke-width="3.5"/><ellipse cx="50" cy="73" rx="17" ry="9" fill="#fff" opacity=".18"/>`;
function heroSVG(id){
  const H=HEROES[id];
  const defs=`<defs><radialGradient id="hg-${id}" cx="36%" cy="28%" r="80%"><stop offset="0" stop-color="${H.l}"/><stop offset=".5" stop-color="${H.c}"/><stop offset="1" stop-color="${H.dk}"/></radialGradient></defs>`;
  const shadow=`<ellipse cx="50" cy="93" rx="25" ry="4.5" fill="#000" opacity=".28"/>`;
  let s="";
  switch(id){

/* ================= reglas ================= */
function areaOf(pat,tx,ty){
  const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
  switch(pat){
    case "row3":{const x0=cl(tx-1,0,N-3);return [[x0,ty],[x0+1,ty],[x0+2,ty]];}
    case "col3":{const y0=cl(ty-1,0,N-3);return [[tx,y0],[tx,y0+1],[tx,y0+2]];}
    case "diag3":{const cx=cl(tx,1,N-2),cy=cl(ty,1,N-2);return [[cx-1,cy-1],[cx,cy],[cx+1,cy+1]];}
    case "sq2":{const x0=Math.min(tx,N-2),y0=Math.min(ty,N-2);return [[x0,y0],[x0+1,y0],[x0,y0+1],[x0+1,y0+1]];}
    case "cross5":return [[tx,ty],...D4.map(([dx,dy])=>[tx+dx,ty+dy])].filter(([x,y])=>inB(x,y));
    default:return [[tx,ty]];
  }
}
const clampN=v=>Math.max(0,Math.min(N-1,v));
let G=null, R=null, MID=0;
function newHero(type,x,y){const H=HEROES[type];return {type,x,y,hp:H.hp,max:H.hp,path:[],nextStep:0,cdUntil:0,shieldUntil:0,turboUntil:0,visionUntil:0};}
function mark(s,m){m.id=++MID;R.marks[s].push(m);return m;}
function pathTo(h,x,y){
  const p=[];let cx=h.x,cy=h.y;const xf=Math.random()<.5;
  const stepX=()=>{while(cx!==x){cx+=Math.sign(x-cx);p.push([cx,cy]);}};
  const stepY=()=>{while(cy!==y){cy+=Math.sign(y-cy);p.push([cx,cy]);}};
  if(xf){stepX();stepY();}else{stepY();stepX();}
  return p;
}
function roundInit(tp,tb){
  R={now:0,heroes:{p:newHero(tp,rnd(N),rnd(N)),b:newHero(tb,rnd(N),rnd(N))},elx:{p:ELX_START,b:ELX_START},
     boosts:[],projs:[],marks:{p:[],b:[]},nextBoost:3,sudden:false,nextPing:SUDDEN_T,over:false,dmg:{p:0,b:0},paused:true};
  const bp=botParams();
  R.bot={belief:normalize(grid(1)),next:0,relocateAt:0,seen:new Set(),react:bp.react,eps:bp.eps,passiveUntil:bp.passive};
}
function stepHero(s){
  const h=R.heroes[s],H=HEROES[h.type];
  if(!h.path.length||R.now<h.nextStep)return;
  if(R.elx[s]<H.mc){h.path=[];if(s==="p")ui.noElx();return;}
  const [x,y]=h.path.shift();
  R.elx[s]-=H.mc;h.x=x;h.y=y;h.nextStep=R.now+H.step;
  mark(s,{t:"step",x,y,until:R.now+.8});
  const bi=R.boosts.findIndex(b=>b.x===x&&b.y===y);
  if(bi>=0){const b=R.boosts.splice(bi,1)[0];applyBoost(s,b);mark(s,{t:"pick",x,y,k:b.k,until:R.now+2.4});ui.pickup(s,b);}
}
function applyBoost(s,b){
  const h=R.heroes[s];
  if(b.k==="elx")R.elx[s]=Math.min(ELX_MAX,R.elx[s]+4);
  if(b.k==="turbo")h.turboUntil=R.now+6;
  if(b.k==="vision")h.visionUntil=R.now+2.5;
  if(b.k==="shield")h.shieldUntil=R.now+12;
}
function spawnBoost(){
  const occ=new Set([key(R.heroes.p.x,R.heroes.p.y),key(R.heroes.b.x,R.heroes.b.y),...R.boosts.map(b=>key(b.x,b.y))]);
  const free=allCells().filter(([x,y])=>!occ.has(key(x,y)));if(!free.length)return;
  const [x,y]=pick(free);
  const ks=Object.keys(BOOSTS);let r=Math.random()*ks.reduce((a,k)=>a+BOOSTS[k].w,0),k=ks[0];
  for(const kk of ks){r-=BOOSTS[kk].w;if(r<=0){k=kk;break;}}
  R.boosts.push({x,y,k,born:R.now,until:R.now+BOOST_LIFE,id:++MID});
  ui.boost();
}
function fakeSpot(h){return pick(allCells().filter(([x,y])=>Math.abs(x-h.x)+Math.abs(y-h.y)>=2));}
function fire(s,tx,ty){
  const h=R.heroes[s],H=HEROES[h.type];
  if(R.now<h.cdUntil)return "cd";
  if(R.elx[s]<H.cost)return "elx";
  R.elx[s]-=H.cost;h.cdUntil=R.now+.45;
  const p={o:s,d:other(s),cells:areaOf(H.pat,tx,ty),hitAt:R.now+H.travel,launched:R.now,dmg:H.dmg,warn:H.warn,type:h.type,id:++MID,fx:h.x,fy:h.y};
  if(!H.stealth){const c=H.fake?fakeSpot(h):[h.x,h.y];p.hx=c[0];p.hy=c[1];mark(s,{t:"huella",x:c[0],y:c[1],until:R.now+HUELLA_T,fake:!!H.fake});}
  R.projs.push(p);ui.fired(p);
  return "ok";
}
function impact(p){
  const v=R.heroes[p.d];
  if(inArea(p.cells,v.x,v.y)){
    if(v.shieldUntil>R.now){v.shieldUntil=0;p.res="block";mark(p.d,{t:"bloq",x:v.x,y:v.y,until:R.now+MARK_T});}
    else{v.hp=Math.max(0,v.hp-p.dmg);R.dmg[p.o]+=p.dmg;p.res="hit";mark(p.d,{t:"hit",x:v.x,y:v.y,type:v.type,until:R.now+MARK_T});}
  }else{
    const near=p.cells.some(([x,y])=>Math.abs(v.x-x)+Math.abs(v.y-y)===1);
    p.res=near?"near":"miss";
    for(const [x,y] of p.cells)mark(p.d,{t:near?"cerca":"agua",x,y,until:R.now+MARK_T});
  }
  ui.impact(p);
}
function timeWinner(){
  const f=s=>R.heroes[s].hp/R.heroes[s].max,a=f("p"),b=f("b");
  if(Math.abs(a-b)<1e-6)return R.dmg.p===R.dmg.b?null:(R.dmg.p>R.dmg.b?"p":"b");
  return a>b?"p":"b";
}
function tick(dt){
  if(!R||R.paused||R.over)return;
  R.now+=dt;
  for(const s of SIDES){const h=R.heroes[s],rate=(h.turboUntil>R.now?2:1)*(R.sudden?1.5:1);R.elx[s]=Math.min(ELX_MAX,R.elx[s]+rate*dt);}
  for(const s of SIDES)stepHero(s);
  const due=R.projs.filter(p=>p.hitAt<=R.now);R.projs=R.projs.filter(p=>p.hitAt>R.now);
  for(const p of due)impact(p);
  R.boosts=R.boosts.filter(b=>b.until>R.now);
  if(R.now>=R.nextBoost){if(R.boosts.length<2)spawnBoost();R.nextBoost=R.now+5+Math.random()*3;}
  for(const s of SIDES)R.marks[s]=R.marks[s].filter(m=>m.until>R.now);
  if(!R.sudden&&R.now>=SUDDEN_T){R.sudden=true;ui.sudden();}
  if(R.sudden&&R.now>=R.nextPing){R.nextPing=R.now+5;for(const s of SIDES){const h=R.heroes[s];mark(s,{t:"ping",x:h.x,y:h.y,type:h.type,until:R.now+1.2});}ui.ping();}
  botUpdate(dt);
  const pd=R.heroes.p.hp<=0,bd=R.heroes.b.hp<=0;
  if(pd||bd||R.now>=ROUND_T){R.over=true;ui.roundOver(pd&&bd?null:bd?"p":pd?"b":timeWinner());}
}

/* ================= bot: mapa de probabilidad en tiempo real ================= */
function normalize(b){let s=0;for(const r of b)for(const v of r)s+=v;if(s<=1e-9)return grid(1/(N*N));return b.map(r=>r.map(v=>v/s));}
function diffuseB(b,f){
  const nb=grid(0);
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const w=b[y][x];if(!w)continue;
    const nbrs=D4.map(([dx,dy])=>[x+dx,y+dy]).filter(([a,c])=>inB(a,c));
    nb[y][x]+=w*(1-f);for(const [a,c] of nbrs)nb[c][a]+=w*f/nbrs.length;
  }
  return nb;
}
function bestArea(pat,bel){
  let bv=-1,bt=[2,2];
  for(const [x,y] of allCells()){const v=areaOf(pat,x,y).reduce((a,[cx,cy])=>a+bel[cy][cx],0)+Math.random()*.02;if(v>bv){bv=v;bt=[x,y];}}
  return {v:bv,t:bt};
}
function botParams(){
  let react=.35,eps=.08,passive=1.5;
  if(G&&G.tutorial){react=.9;eps=.45;passive=7;}
  if(G&&G.score.b>G.score.p){react+=.2;eps+=.15;}
  if(S.tro<60){eps+=.07;react+=.1;}
  return {react,eps,passive};
}
function botUpdate(dt){
  const B=R.bot,me=R.heroes.b,foe=R.heroes.p,H=HEROES[me.type],HF=HEROES[foe.type];
  B.belief=normalize(diffuseB(B.belief,Math.min(.9,dt/HF.step*.35)));
  const setExact=(x,y,w)=>{const b=B.belief.map(r=>r.map(v=>v*(1-w)));b[y][x]+=w;B.belief=normalize(b);};
  for(const m of R.marks.p){
    if(B.seen.has(m.id))continue;B.seen.add(m.id);
    if(m.t==="huella")setExact(m.x,m.y,.75);
    else if(m.t==="pick"||m.t==="hit"||m.t==="ping"||m.t==="bloq")setExact(m.x,m.y,.92);
    else if(m.t==="step"&&H.ears)setExact(m.x,m.y,.9);
    else if(m.t==="agua"){B.belief[m.y][m.x]*=.05;B.belief=normalize(B.belief);}
    else if(m.t==="cerca"){B.belief[m.y][m.x]*=.05;for(const [dx,dy] of D4){const nx=m.x+dx,ny=m.y+dy;if(inB(nx,ny))B.belief[ny][nx]*=1.6;}B.belief=normalize(B.belief);}
  }
  if(me.visionUntil>R.now)setExact(foe.x,foe.y,.95);
  if(R.now<B.next)return;B.next=R.now+.2;
  const hpLead=me.hp/me.max-foe.hp/foe.max, eps=B.eps+(hpLead>.34?.15:0);
  const danger=R.projs.filter(p=>p.d==="b"&&p.warn&&R.now-p.launched>=B.react);
  const unsafe=(x,y)=>danger.some(p=>inArea(p.cells,x,y));
  const adj=()=>D4.map(([dx,dy])=>[me.x+dx,me.y+dy]).filter(([x,y])=>inB(x,y)&&!unsafe(x,y));
  if(unsafe(me.x,me.y)){const o=adj();if(o.length&&R.elx.b>=H.mc){me.path=[pick(o)];return;}}
  if(B.relocateAt&&R.now>=B.relocateAt&&!me.path.length){
    B.relocateAt=0;
    const o=allCells().filter(([x,y])=>{const d=Math.abs(x-me.x)+Math.abs(y-me.y);return d>=1&&d<=2&&!unsafe(x,y);});
    if(o.length&&R.elx.b>=H.mc*2){const c=pick(o);me.path=pathTo(me,c[0],c[1]);return;}
  }
  if(R.now<B.passiveUntil)return;
  if(R.now>=me.cdUntil&&R.elx.b>=H.cost&&!me.path.length){
    let bel=B.belief.map(r=>r.slice());
    for(const bo of R.boosts)bel[bo.y][bo.x]+=.06;
    if(H.travel>.6)bel=diffuseB(bel,Math.min(.9,H.travel/HF.step*.35));
    const best=bestArea(H.pat,bel);
    let thr=H.pat==="one"?.42:.38;if(R.elx.b>=9)thr*=.55;
    if(best.v>=thr){
      let t=best.t;
      if(Math.random()<eps)t=[clampN(t[0]+rnd(3)-1),clampN(t[1]+rnd(3)-1)];
      if(Math.random()<eps*.5)t=[rnd(N),rnd(N)];
      fire("b",t[0],t[1]);
      if(!HEROES[me.type].stealth)B.relocateAt=R.now+.25+Math.random()*.6;
      return;
    }
  }
  if(!me.path.length&&R.boosts.length){
    const bo=R.boosts.map(b=>({b,d:Math.abs(b.x-me.x)+Math.abs(b.y-me.y)})).sort((a,c)=>a.d-c.d)[0];
    if(bo.d<=3&&R.elx.b>=bo.d*H.mc+1&&Math.random()<.3){me.path=pathTo(me,bo.b.x,bo.b.y);return;}
  }
  if(!me.path.length&&R.elx.b>H.cost+H.mc&&Math.random()<.08){const o=adj();if(o.length)me.path=[pick(o)];}
}

function arenaOf(t){let a=ARENAS[0],n=null;for(let i=0;i<ARENAS.length;i++){if(t>=ARENAS[i].t){a=ARENAS[i];n=ARENAS[i+1]||null;}}return {a,n};}
function hearts(hp,max){return Array.from({length:max},(_,i)=>`<i class="${i<hp?"":"off"}">♥</i>`).join("");}
function statsHTML(id){
  const H=HEROES[id];
  return `<div class="stats">
    <div><span>❤️ Vida</span><b class="hbar">${hearts(H.hp,H.hp)}</b></div>
    <div><span>👟 Velocidad</span><b>${speedLabel(H.step)} · 💧${H.mc}/casilla</b></div>
    <div><span>💥 Ataque</span><b>${patIcon(H.pat)} quita ${H.dmg} · 💧${H.cost}</b></div>

}

    m.innerHTML=M.found?`<div class="sheet"><h2 class="out">¡Rival encontrado!</h2><div class="vs"><div class="p"><div class="av">${heroSVG(S.unl[0])}</div><b class="out" style="color:var(--me)">TÚ</b><small>🏆 ${S.tro}</small></div><div class="mid out">VS</div><div class="p"><div class="av">${heroSVG(G.oppPool[0])}</div><b class="out" style="color:var(--foe)">${G.opp.name}</b><small>🏆 ${G.opp.tro}</small></div></div></div>`
      :`<div class="sheet"><h2 class="out">Buscando rival…</h2><div style="display:flex;justify-content:center"><div class="av spin">${heroSVG(pick(IDS))}</div></div></div>`;
  }else if(M.k==="vs"){
    m.innerHTML=`<div class="sheet"><h2 class="out">RONDA ${G.round}</h2><div class="vs"><div class="p"><div class="av big">${heroSVG(M.p)}</div><b class="out" style="color:var(--me)">${HEROES[M.p].n}</b><small>Tú</small></div><div class="mid out">VS</div><div class="p"><div class="av big">${heroSVG(M.b)}</div><b class="out" style="color:var(--foe)">${HEROES[M.b].n}</b><small>${G.opp.name}</small></div></div></div>`;
  }else if(M.k==="chest"){

      m.innerHTML=`<div class="sheet"><h2 class="out">¡Cofre!</h2><button class="chestbig ${M.taps?"shake":""}" data-a="ctap" aria-label="Abrir cofre">${chestSVG()}</button><p>${["Toca el cofre","¡Otra vez!","¡Ya casi!"][M.taps]}</p></div>`;
    }else if(M.reward.hero){

      m.innerHTML=`<div class="sheet"><div class="reward" style="--rc:${RR.c}"><p class="rar" style="color:${RR.c}">${RR.n} · ¡NUEVO!</p><span class="pt glow">${heroSVG(M.reward.hero)}</span><h2 class="out">¡${H.n}!</h2></div>${statsHTML(M.reward.hero)}<button class="gbtn" data-a="rok">¡GENIAL!</button></div>`;
    }else{
      m.innerHTML=`<div class="sheet"><div class="reward"><div style="font-size:90px">🏆</div><h2 class="out">+40 trofeos</h2><p>¡Ya tienes todos los héroes!</p></div><button class="gbtn" data-a="rok">¡GENIAL!</button></div>`;
    }

async function openChestTap(){
  const M=UI.modal;M.taps=(M.taps||0)+1;sfx("chest");buzz(30);
  if(M.taps<3){renderModal();return;}
  const el=$(".chestbig");el.classList.add("open");sfx("open");
  const c=center(el);burst(c.x,c.y,["#ffcc1f","#fff","#ffe9a0","#c07bff"],70,11,.2);
  await sleep(550);
  const locked=IDS.filter(id=>!S.unl.includes(id));
  S.chests=Math.max(0,S.chests-1);
  if(locked.length){
    const w=locked.map(id=>({id,w:[6,3,2,1][HEROES[id].rar]}));let r=Math.random()*w.reduce((a,b)=>a+b.w,0),got=w[0].id;
    for(const it of w){r-=it.w;if(r<=0){got=it.id;break;}}
    S.unl.push(got);M.reward={hero:got};
  }else{S.tro+=40;M.reward={tro:40};}
  save();renderModal();confetti();sfx("win");
}

/* ================= partida ================= */
function startMatch(){
  sfx("go");actx();
  const maxR=Math.min(3,1+Math.floor(S.tro/150));
  let pool=shuffle(IDS.filter(i=>HEROES[i].rar<=maxR));
  G={score:{p:0,b:0},round:0,used:{p:[],b:[]},tutorial:S.games===0,opp:{name:pick(NAMES),tro:Math.max(0,S.tro+rnd(41)-20)},oppPool:pool};
  UI.modal={k:"search",found:false};renderModal();
  setTimeout(()=>{if(UI.modal&&UI.modal.k==="search"){UI.modal.found=true;renderModal();sfx("banner");}},900);
  setTimeout(()=>{UI.modal=null;renderModal();G.round=1;showPick();},2100);
}
function availP(){const a=S.unl.filter(i=>!G.used.p.includes(i));return a.length?a:S.unl.slice();}
function showPick(){
  UI.screen="pick";app.className="";stopLoop();
  const av=availP();
  if(!G.pickSel||!av.includes(G.pickSel))G.pickSel=av[0];
  const id=G.pickSel;
  app.innerHTML=`<div class="pickhead"><span class="stars big">${starsHTML("p")}</span><h2 class="out">RONDA ${G.round}</h2><span class="stars big">${starsHTML("b")}</span></div>
    <p class="slogan">Elige tu héroe para esta ronda. No se puede repetir.</p>
    <div class="hrow">${S.unl.map(h=>{const used=G.used.p.includes(h)&&av!==S.unl;return `<button class="hchip ${h===id?"on":""} ${used?"used":""}" data-a="psel" data-id="${h}" ${used?"disabled":""} aria-label="${HEROES[h].n}">${heroSVG(h)}${used?"<i>✓</i>":""}</button>`;}).join("")}</div>
    <div class="pickcard"><div class="hdetail"><span class="pt bob">${heroSVG(id)}</span><div><span class="rar" style="color:${RAR[HEROES[id].rar].c}">${RAR[HEROES[id].rar].n}</span><h3 class="out">${HEROES[id].n}</h3><small>${HEROES[id].r}</small></div></div>${statsHTML(id)}</div>
    <button class="gbtn red play pulse" data-a="fight">¡A LUCHAR!</button>`;
  if(G.round===1&&!S.tips.pick)toast("pick","🦸 Cada héroe es distinto: mira su <b>vida</b>, su <b>velocidad</b> y si su ataque <b>avisa</b>.");
}
function starsHTML(s){return [0,1].map(i=>`<span class="${i<G.score[s]?"on":"off"}">★</span>`).join("");}
async function startRound(){
  const tp=G.pickSel;
  const tb=G.oppPool.find(i=>!G.used.b.includes(i))||pick(IDS);
  roundInit(tp,tb);
  UI.modal={k:"vs",p:tp,b:tb};renderModal();sfx("banner");
  await sleep(1500);
  UI.modal=null;renderModal();
  buildArena();renderLive(true);
  for(const n of ["3","2","1"]){sfx("tick");await banner(n,"","gold",600);}
  banner("¡YA!","","red",700);
  R.paused=false;startLoop();
  toast("controls","👇 Toca <b>tu tablero</b> para moverte · 👆 toca el <b>ROJO</b> para disparar. Todo cuesta 💧 elixir.");
}
function startLoop(){stopLoop();lastT=performance.now();loopId=requestAnimationFrame(loop);}
function stopLoop(){if(loopId)cancelAnimationFrame(loopId);loopId=null;}
function loop(t){
  if(!R)return;
  const dt=Math.min(.1,(t-lastT)/1000);lastT=t;
  if(!document.hidden&&!UI.modal)tick(dt);
  renderAcc+=dt;if(renderAcc>=.08){renderAcc=0;renderLive();}
  if(R&&!R.over)loopId=requestAnimationFrame(loop);
}
async function endRound(w){
  stopLoop();renderLive();
  const b=R.heroes.b,layer=$("#tk-b");
  if(layer){layer.innerHTML=`<div class="tok foe reveal" style="--x:${b.x};--y:${b.y}"><span class="ring"></span><span class="bob">${heroSVG(b.type)}</span></div>`;}
  await sleep(900);
  if(w)G.score[w]++;
  G.used.p.push(R.heroes.p.type);G.used.b.push(R.heroes.b.type);
  if(w==="p"){confetti();sfx("win");await banner("¡RONDA PARA TI!","","gold",1600);}
  else if(w==="b"){sfx("lose");await banner("RONDA PARA "+G.opp.name.toUpperCase(),"","red",1600);}
  else await banner("¡EMPATE!","Nadie suma estrella","blue",1400);
  if(G.score.p>=2||G.score.b>=2||G.round>=5)return endMatch();
  G.round++;showPick();
}
async function endMatch(){
  R=null;
  const win=G.score.p>G.score.b,draw=G.score.p===G.score.b;
  const before=S.tro,shield=!win&&!draw&&before<30;
  const delta=win?28+rnd(5):draw||shield?0:-Math.min(before,8+rnd(5));
  S.tro=S.tro+delta;S.games++;if(win){S.wins++;S.chests++;}
  save();
  UI.screen="end";app.className="center";
  app.innerHTML=`<p class="endt out ${win?"win":draw?"draw":"lose"}">${win?"¡VICTORIA!":draw?"EMPATE":"DERROTA"}</p>
    <div class="stage">${G.used.p.slice(0,3).map(t=>`<div class="hst"><div class="bob">${heroSVG(t)}</div></div>`).join("")}</div>
    <div class="trobig out">🏆 <span id="tro">${before}</span> <small class="${delta>=0?"up":"dn"}">${delta>=0?"+":""}${delta}</small></div>
    ${win?`<button class="chestbtn" data-a="chest" style="align-self:center">${chestSVG()}<span>¡Has ganado un cofre!<br><b>Toca para abrir</b></span></button>`:`<p class="slogan">${draw?"¡Igualadísimo!":shield?"🛡️ Protección de novato: no pierdes trofeos":"¡Casi! La próxima es tuya."}</p>`}
    <button class="gbtn play" data-a="play">JUGAR OTRA</button>
    <button class="pillbtn" data-a="home" style="align-self:center">Volver al inicio</button>`;
  if(win){confetti();sfx("win");}else if(!draw)sfx("lose");
  for(let i=1;i<=20;i++){await sleep(45);const el=$("#tro");if(!el)break;el.textContent=Math.round(before+delta*i/20);if(i%2)sfx("coin");}
}

const tileEl=(b,x,y)=>$(`#bd-${b} .tile[data-x="${x}"][data-y="${y}"]`);
function buildArena(){
  UI.screen="game";app.className="";
  const hp=R.heroes.p,hb=R.heroes.b,H=HEROES[hp.type];
  const tiles=b=>allCells().map(([x,y])=>`<button class="tile" data-a="tile" data-b="${b}" data-x="${x}" data-y="${y}" aria-label="${"ABCDE"[x]}${y+1}"><span class="tc"></span></button>`).join("");
  app.innerHTML=`
  <div class="ghud">
    <div class="side2"><span class="mini">${heroSVG(hp.type)}</span><div class="sinfo"><span class="nm out" style="color:var(--me)">TÚ</span><span class="hearts" id="hp-p"></span></div></div>
    <div class="tbox"><span class="t out" id="clock">1:30</span><span class="stars"><span id="st-p">${starsHTML("p")}</span>&nbsp;<span id="st-b">${starsHTML("b")}</span></span></div>
    <div class="side2 foe"><div class="sinfo"><span class="nm out" style="color:var(--foe)">${G.opp.name}</span><span class="hearts" id="hp-b"></span></div><span class="mini">${heroSVG(hb.type)}</span></div>
  </div>
  <div class="bwrap foe" id="bw-b"><span class="ribbon foe out">RIVAL · ${HEROES[hb.type].n}</span><div class="board" id="bd-b">${tiles("b")}</div><div class="toks" id="tk-b"></div></div>
  <div class="status" id="status"></div>
  <div class="bwrap me" id="bw-p"><span class="ribbon me">TÚ · ${H.n}</span><div class="board" id="bd-p">${tiles("p")}</div><div class="toks" id="tk-p"><button class="tok" id="mytok" data-a="noop" style="transition:transform ${H.step}s linear"><span class="ring"></span><span class="bob">${heroSVG(hp.type)}</span><span class="extra"></span></button></div></div>
  <div class="ebar" id="ebar"><span class="elxn out" id="elxn">5</span><div class="esegs" id="esegs">${Array.from({length:ELX_MAX},()=>`<i><b></b></i>`).join("")}</div></div>
  <div class="acts"><span class="act">👟 <b>💧${H.mc}</b> moverse</span><span class="act">${patIcon(H.pat)} <b>💧${H.cost}</b> disparar ${H.warn?"🔔":"⚡"}</span><span class="act bst" id="bst"></span></div>`;
  tileCache={};
}
let tileCache={};
function setTile(el,cls,html){const k=el.dataset.b+el.dataset.x+el.dataset.y;const v=cls+"|"+html;if(tileCache[k]===v)return;tileCache[k]=v;el.className=cls;el.firstElementChild.innerHTML=html;}
function ringHTML(frac,inner,cls=""){return `<span class="ringt ${cls}" style="--p:${Math.round(frac*100)}">${inner}</span>`;}
function renderLive(force){
  if(!R||UI.screen!=="game")return;
  const me=R.heroes.p,foe=R.heroes.b,now=R.now,H=HEROES[me.type];
  // hud
  $("#hp-p").innerHTML=hearts(me.hp,me.max);$("#hp-b").innerHTML=hearts(foe.hp,foe.max);
  const left=Math.max(0,ROUND_T-now),ck=$("#clock");
  ck.textContent=R.sudden?"⚡ "+Math.ceil(left)+"s":Math.floor(left/60)+":"+String(Math.floor(left%60)).padStart(2,"0");ck.classList.toggle("sd",R.sudden);
  const e=R.elx.p;$("#elxn").textContent=Math.floor(e);
  document.querySelectorAll("#esegs i b").forEach((b,i)=>{b.style.width=Math.max(0,Math.min(1,e-i))*100+"%";});
  const segs=$("#esegs");segs.classList.toggle("turbo",me.turboUntil>now);
  const bst=[];if(me.turboUntil>now)bst.push("⚡"+Math.ceil(me.turboUntil-now)+"s");if(me.shieldUntil>now)bst.push("🛡️");if(me.visionUntil>now)bst.push("👁");
  $("#bst").textContent=bst.join(" ");
  // tablero rival
  const myProjs=R.projs.filter(p=>p.o==="p");
  const canShoot=e>=H.cost&&now>=me.cdUntil;
  $("#bw-b").classList.toggle("aiming",canShoot&&!R.paused&&!R.over);
  for(const el of document.querySelectorAll("#bd-b .tile")){
    const x=+el.dataset.x,y=+el.dataset.y,cls=["tile"];let h="";
    const mp=myProjs.find(p=>inArea(p.cells,x,y));
    if(mp){cls.push("myzone");h=ringHTML(1-(now-mp.launched)/(mp.hitAt-mp.launched),"🎯","z");}
    const ms=R.marks.b.filter(m=>m.x===x&&m.y===y);
    const top=ms.find(m=>m.t==="hit")||ms.find(m=>m.t==="ping")||ms.find(m=>m.t==="bloq")||ms.find(m=>m.t==="pick")||ms.find(m=>m.t==="huella")||ms.find(m=>m.t==="cerca")||ms.find(m=>m.t==="agua")||(H.ears?ms.find(m=>m.t==="step"):null);
    if(top&&!mp){
      if(top.t==="hit")h=`<span class="mk">${heroSVG(top.type)}<span class="bdg">💥</span></span>`;
      else if(top.t==="ping")h=`<span class="mk">${heroSVG(top.type)}<span class="bdg">📡</span></span>`;
      else if(top.t==="bloq")h=`<span class="wico">🛡️</span>`;
      else if(top.t==="pick")h=`<span class="mk"><span class="wico">${BOOSTS[top.k].i}</span><span class="bdg">👀</span></span>`;
      else if(top.t==="huella")h=FOOT.replace('class="fp"',`class="fp" style="opacity:${Math.max(.25,(top.until-now)/HUELLA_T)}"`);
      else if(top.t==="cerca"){cls.push("near");h=`<span class="flame">🔥</span>`;}
      else if(top.t==="agua")h=`<span class="water"></span>`;
      else if(top.t==="step")h=`<span class="ripple"></span>`;
    }
    const bo=R.boosts.find(b=>b.x===x&&b.y===y);
    if(bo&&!h)h=ringHTML((bo.until-now)/BOOST_LIFE,BOOSTS[bo.k].i,"boost");
    setTile(el,cls.join(" "),h);
  }
  // rival visible en vivo con visión
  const tkb=$("#tk-b");
  if(me.visionUntil>now){tkb.innerHTML=`<div class="tok foe" style="--x:${foe.x};--y:${foe.y}"><span class="ring"></span><span class="bob">${heroSVG(foe.type)}</span></div>`;}
  else if(tkb.innerHTML&&!R.over)tkb.innerHTML="";
  // mi tablero
  const inc=R.projs.filter(p=>p.o==="b"&&p.warn);
  const dest=me.path.length?me.path[me.path.length-1]:null;
  for(const el of document.querySelectorAll("#bd-p .tile")){
    const x=+el.dataset.x,y=+el.dataset.y,cls=["tile"];let h="";
    const ip=inc.find(p=>inArea(p.cells,x,y));
    if(ip){cls.push("warn");h=ringHTML(1-(now-ip.launched)/(ip.hitAt-ip.launched),"⚠️","w");}
    const bo=R.boosts.find(b=>b.x===x&&b.y===y);
    if(bo&&!h)h=ringHTML((bo.until-now)/BOOST_LIFE,BOOSTS[bo.k].i,"boost");
    const seen=R.marks.p.find(m=>m.x===x&&m.y===y&&(m.t==="huella"||m.t==="pick"));
    if(seen&&!h)h=FOOT.replace('class="fp"',`class="fp ${seen.fake?"fake":""}" style="opacity:.55"`);
    if(dest&&dest[0]===x&&dest[1]===y)cls.push("ghost");
    setTile(el,cls.join(" "),h);
  }
  const tok=$("#mytok");
  if(tok){
    tok.style.setProperty("--x",me.x);tok.style.setProperty("--y",me.y);
    const seenNow=R.marks.p.some(m=>(m.t==="huella"&&!m.fake)||m.t==="pick"||m.t==="hit"||m.t==="ping"||m.t==="bloq")||(HEROES[foe.type].ears&&R.marks.p.some(m=>m.t==="step"));
    tok.querySelector(".extra").innerHTML=(me.shieldUntil>now?`<span class="shieldfx"></span>`:"")+(seenNow?`<span class="seen">TE VEN</span>`:"");
  }
  renderStatus();
}
function renderStatus(){
  const el=$("#status");if(!el||!R)return;
  const me=R.heroes.p,now=R.now;let t,c="";
  const danger=R.projs.some(p=>p.o==="b"&&p.warn&&inArea(p.cells,me.x,me.y));
  if(R.paused)t="⏳ ¡Prepárate!";
  else if(danger){t="⚠️ ¡Muévete! Algo cae en la zona roja";c="warn";}
  else if(R.marks.b.some(m=>m.t==="hit"||m.t==="ping")||me.visionUntil>now){t="👀 ¡Rival a la vista! Dispara";c="good";}
  else if(R.marks.b.some(m=>m.t==="pick")){t="👀 ¡Cogió un objeto ahí!";c="good";}
  else if(R.marks.b.some(m=>m.t==="huella")){t="👣 ¡Ha disparado desde ahí!";c="good";}
  else if(R.marks.p.some(m=>(m.t==="huella"&&!m.fake)||m.t==="pick")){t="👣 ¡Te han visto! Cambia de sitio";c="bad";}
  else if(R.boosts.length){t="🎁 Objeto en el mapa: ¿cebo o premio?";}
  else if(R.elx.p<HEROES[me.type].cost){t="💧 Cargando elixir…";}
  else t="🎯 Busca al rival";
  const html=`<span class="${c}">${t}</span>`;if(el.innerHTML!==html)el.innerHTML=html;
}

/* ================= efectos de la partida ================= */
function toast(k,txt){
  if(S.tips[k])return;S.tips[k]=1;save();
  const old=$(".toast");if(old)old.remove();
  const e=document.createElement("div");e.className="toast";e.dataset.a="toast";e.innerHTML=txt;document.body.appendChild(e);
  setTimeout(()=>e.remove(),5200);
}
function areaCenter(b,cells){let sx=0,sy=0;for(const [x,y] of cells){const c=center(tileEl(b,x,y));sx+=c.x;sy+=c.y;}return {x:sx/cells.length,y:sy/cells.length};}
function projectile(from,to,type,dur){
  if(REDUCED)return;
  const e=document.createElement("div");e.className="proj";
  const H=HEROES[type];let inner;
  switch(H.proj){
    case "arrow":inner=`<svg width="40" height="12" viewBox="0 0 40 12"><line x1="2" y1="6" x2="32" y2="6" stroke="#fff" stroke-width="3"/><path d="M30 1 L40 6 L30 11Z" fill="#fff"/><path d="M2 2 L8 6 L2 10" stroke="${H.c}" stroke-width="3" fill="none"/></svg>`;break;
    case "star":inner=`<span style="font-size:26px;color:#fff;text-shadow:0 0 10px ${H.c}">✦</span>`;break;
    case "bolt":inner=`<span style="font-size:30px;filter:drop-shadow(0 0 8px ${H.c})">⚡</span>`;break;
    default:inner=`<span class="orb" style="background:${H.proj==="fire"?"#ffd27a":H.proj==="bomb"?"#2a2f4a":H.l};color:${H.proj==="fire"?"#ff6b3d":H.c}"></span>`;
  }
  e.innerHTML=inner;document.body.appendChild(e);
  const dx=to.x-from.x,dy=to.y-from.y,ang=H.proj==="arrow"?Math.atan2(dy,dx)*180/Math.PI:0,lift=Math.min(120,Math.hypot(dx,dy)*.3);
  e.animate([{transform:`translate(${from.x}px,${from.y}px) rotate(${ang}deg) scale(.6)`},{transform:`translate(${(from.x+to.x)/2}px,${(from.y+to.y)/2-lift}px) rotate(${ang}deg) scale(1.2)`},{transform:`translate(${to.x}px,${to.y}px) rotate(${ang}deg) scale(1)`}],{duration:Math.max(120,dur*1000),easing:"cubic-bezier(.45,0,.55,1)"}).finished.then(()=>e.remove(),()=>e.remove());
}
function flashTiles(b,cells){for(const [x,y] of cells){const t=tileEl(b,x,y);if(t){t.classList.remove("boom");void t.offsetWidth;t.classList.add("boom");setTimeout(()=>t.classList.remove("boom"),650);}}}
const ui={
  fired(p){
    if(UI.screen!=="game")return;
    sfx("shoot");
    if(p.o==="p"){
      const tok=$("#mytok");projectile(center(tok),areaCenter("b",p.cells),p.type,p.travel??HEROES[p.type].travel);
      if(!HEROES[p.type].stealth)toast("myprint","👣 <b>Tu disparo te ha delatado.</b> El rival ve desde dónde. ¡Muévete!");
    }else{
      if(p.warn){
        const r=$("#bw-b").getBoundingClientRect();
        const from=p.hx!=null?center(tileEl("b",p.hx,p.hy)):{x:r.left+r.width/2,y:r.top-20};
        projectile(from,areaCenter("p",p.cells),p.type,HEROES[p.type].travel);
        toast("incoming","⚠️ <b>¡Algo va a caer en la zona roja!</b> Toca otra casilla para esquivarlo.");
        buzz(25);
      }
      if(p.hx!=null)toast("foeprint","👣 <b>¡El rival disparó desde ahí!</b> Contraataca rápido.");
    }
  },
  impact(p){
    if(UI.screen!=="game")return;
    const tb=p.d, to=areaCenter(tb,p.cells), mine=p.o==="p";
    flashTiles(tb,p.cells);
    for(const [x,y] of p.cells){const c=center(tileEl(tb,x,y));burst(c.x,c.y,[HEROES[p.type].c,"#fff","#ffcc1f"],7,4);}
    if(mine){
      if(p.res==="hit"){const v=R.heroes.b,c=center(tileEl("b",v.x,v.y));const ko=v.hp<=0;
        burst(c.x,c.y,[HEROES[v.type].c,"#ffcc1f","#fff"],ko?60:28,ko?10:6);floatText(c.x,c.y-10,ko?"¡K.O.!":"¡TOCADO! −"+p.dmg,"big");sfx(ko?"kill":"hit");buzz(ko?[40,30,60]:40);shake($("#bw-b"),ko);}
      else if(p.res==="block"){floatText(to.x,to.y,"🛡️ ¡Bloqueado!","miss");sfx("miss");}
      else if(p.res==="near"){floatText(to.x,to.y,"¡CERCA! 🔥","near");sfx("near");toast("near","🔥 <b>¡CERCA!</b> El rival estaba justo al lado. ¡Remata!");}
      else{floatText(to.x,to.y,"AGUA","miss");sfx("miss");}
    }else{
      const tok=$("#mytok"),c=center(tok);
      if(p.res==="hit"){tok.classList.remove("hit");void tok.offsetWidth;tok.classList.add("hit");floatText(c.x,c.y-10,R.heroes.p.hp<=0?"K.O.":"−"+p.dmg,"bad");vignette();sfx(R.heroes.p.hp<=0?"ko":"hurt");buzz(60);shake(app,R.heroes.p.hp<=0);}
      else if(p.res==="block"){floatText(c.x,c.y-10,"🛡️ ¡Parado!","good");sfx("near");}
      else if(p.res==="near"){floatText(to.x,to.y,"¡Uf! Por poco","miss");}
    }
  },
  pickup(s,b){
    if(UI.screen!=="game")return;
    if(s==="p"){const c=center($("#mytok"));floatText(c.x,c.y-14,BOOSTS[b.k].i+" "+BOOSTS[b.k].d,"good");sfx("coin");sfx("near");buzz(20);
      toast("mypick","👀 <b>¡Ojo!</b> Al coger el objeto, el rival ha visto dónde estás.");}
    else{const c=center(tileEl("b",b.x,b.y));floatText(c.x,c.y,"👀 ¡Lo cogió!","near");sfx("radar");toast("foepick","👀 <b>¡El rival cogió el objeto!</b> Sabes que está ahí. ¡Dispara!");}
  },
  boost(){if(UI.screen!=="game")return;sfx("tap");toast("boost","🎁 <b>¡Objeto!</b> Sale en el mismo sitio para los dos. Si lo coges, el rival sabrá dónde estás.");},
  noElx(){const b=$("#ebar");if(b)shake(b);sfx("miss");toast("noelx","💧 <b>Sin elixir.</b> Espera un momento a que se recargue o coge un 💧.");},
  sudden(){banner("¡MUERTE SÚBITA!","Os veréis cada 5 s","red",1500);},
  ping(){sfx("radar");},
  roundOver(w){endRound(w);},
};

/* ================= entrada ================= */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-a]");if(!el)return;
  const a=el.dataset.a;
  if(a==="mback"){if(e.target===el&&UI.modal&&["heroes","how","settings"].includes(UI.modal.k)){UI.modal=null;renderModal();}return;}
  if(a==="toast"){el.remove();return;}
  switch(a){
    case "play":sfx("tap");startMatch();break;
    case "home":sfx("tap");UI.modal=null;showHome();break;
    case "settings":sfx("tap");UI.modal={k:"settings"};renderModal();break;
    case "tsnd":S.snd=S.snd?0:1;save();sfx("tap");renderModal();break;
    case "reset1":UI.modal.confirm=true;renderModal();break;
    case "reset0":UI.modal.confirm=false;renderModal();break;
    case "reset2":S=clone(DEF);save();UI.modal=null;showHome();break;
    case "close":sfx("tap");UI.modal=null;renderModal();break;
    case "heroes":sfx("tap");UI.modal={k:"heroes",sel:S.unl[S.unl.length-1]};renderModal();break;
    case "hsee":sfx("sel");UI.modal.sel=el.dataset.id;renderModal();break;
    case "how":sfx("tap");UI.modal={k:"how",i:0};renderModal();break;
    case "hownext":sfx("tap");if(UI.modal.i<HOW.length-1){UI.modal.i++;renderModal();}else{UI.modal=null;renderModal();}break;
    case "chest":sfx("chest");UI.modal={k:"chest",taps:0};renderModal();break;
    case "ctap":openChestTap();break;
    case "rok":sfx("tap");UI.modal=null;showHome();break;
    case "psel":sfx("sel");G.pickSel=el.dataset.id;showPick();break;
    case "fight":sfx("go");startRound();break;
    case "tile":onTile(el.dataset.b,+el.dataset.x,+el.dataset.y);break;
  }
});
function onTile(b,x,y){
  if(!R||R.paused||R.over)return;
  const me=R.heroes.p;
  if(b==="p"){
    if(me.x===x&&me.y===y){me.path=[];return;}
    me.path=pathTo(me,x,y);sfx("sel");renderLive();return;
  }
  const r=fire("p",x,y);
  if(r==="elx"){ui.noElx();const c=center(tileEl("b",x,y));floatText(c.x,c.y,"💧 Falta elixir","miss");}
  else if(r==="ok")renderLive();
}
document.addEventListener("visibilitychange",()=>{lastT=performance.now();});

fxInit();
showHome();

</script>
