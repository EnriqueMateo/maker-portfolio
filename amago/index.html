<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--ARTIFACT-START-->
<title>AMAGO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Figtree:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: una sola columna tipo móvil; tablero rival arriba, el tuyo abajo, panel de acciones al pie */
:root{
  --bg:#0e1322; --surface:#161d33; --cell:#1f2945; --cell-2:#26325a; --line:#33406a;
  --fg:#e9edf9; --muted:#8a94b8;
  --me:#4cc3ff; --foe:#ff5c7a; --warn:#ffb547; --lava:#ff6a2b; --ok:#5be3a0;
  --f-display:"Bungee", "Impact", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --cellsz:clamp(32px, min(12.5vw, 5svh), 56px);
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;-webkit-tap-highlight-color:transparent}
#app{max-width:460px;margin:0 auto;padding-inline:16px;padding-block:10px 24px;display:flex;flex-direction:column;gap:10px;min-height:100%;box-sizing:border-box}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--warn);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.logo{font-family:var(--f-display);font-size:26px;letter-spacing:.04em;margin:0;line-height:1}
.logo b{color:var(--foe);font-weight:400}
.score{font-family:var(--f-mono);font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:center;font-variant-numeric:tabular-nums}
.score .me{color:var(--me)} .score .foe{color:var(--foe)}
.hud{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.hud strong{color:var(--fg)}
.timer{flex:1;height:6px;border-radius:3px;background:var(--cell);overflow:hidden}
.timer i{display:block;height:100%;background:var(--me);width:100%;transition:width .1s linear}
.timer.low i{background:var(--foe)}
.tsec{font-family:var(--f-mono);min-width:3ch;text-align:right;font-variant-numeric:tabular-nums}

/* tableros */
.boardwrap{display:flex;flex-direction:column;align-items:center;gap:4px}
.blabel{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);align-self:stretch;display:flex;justify-content:space-between}
.blabel.foe span:first-child{color:var(--foe)} .blabel.me span:first-child{color:var(--me)}
.board{display:grid;grid-template-columns:16px repeat(5,var(--cellsz));grid-template-rows:14px repeat(5,var(--cellsz));gap:4px;align-items:center}
.board .hdr{font-family:var(--f-mono);font-size:10px;color:var(--muted);text-align:center;height:14px;line-height:14px}
.cell{position:relative;width:var(--cellsz);height:var(--cellsz);border-radius:9px;border:1px solid var(--line);background:var(--cell);padding:0;display:grid;place-items:center;cursor:pointer;overflow:hidden}
.cell.rock{background:repeating-linear-gradient(45deg,var(--cell-2) 0 6px,var(--line) 6px 9px);cursor:default}
.cell.lava{background:radial-gradient(circle at 50% 60%,var(--lava),#7a1d0c);border-color:var(--lava)}
.cell.lavasoon{box-shadow:inset 0 0 0 2px var(--lava);animation:pulse 1s infinite alternate}
.cell.hl{background:var(--cell-2);border-color:var(--me)}
.cell.tgt{border-color:var(--foe);background:color-mix(in srgb,var(--foe) 14%,var(--cell))}
.cell.area{box-shadow:inset 0 0 0 3px var(--foe)}
.cell.fbwarn{background:repeating-linear-gradient(-45deg,color-mix(in srgb,var(--warn) 40%,var(--cell)) 0 7px,var(--cell) 7px 14px);border-color:var(--warn)}
.cell.fbmine{box-shadow:inset 0 0 0 3px var(--warn)}
.cell.hintcol{background:color-mix(in srgb,var(--warn) 9%,var(--cell))}
.cell.sel{border-color:var(--me);box-shadow:0 0 0 2px var(--me)}
.cell.leaving .u{opacity:.4}
.cell.dest{border:2px dashed var(--me)}
.cell .u{font-size:calc(var(--cellsz)*.5);line-height:1}
.cell .ghost{font-size:calc(var(--cellsz)*.42);opacity:.55}
.cell .hp{position:absolute;bottom:3px;left:0;right:0;display:flex;gap:2px;justify-content:center}
.cell .hp i{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.cell .hp i.off{background:var(--line)}
.cell .cd{position:absolute;top:2px;right:3px;font-family:var(--f-mono);font-size:10px;color:var(--warn)}
.cell .act{position:absolute;top:2px;left:3px;font-size:10px}
.cell .exposed{position:absolute;inset:3px;border:2px dashed var(--foe);border-radius:7px;opacity:.8;pointer-events:none}
.cell .huella{width:58%;height:58%;border-radius:50%;border:3px solid var(--foe);box-shadow:0 0 12px var(--foe)}
.cell .huella.old{opacity:.4;box-shadow:none}
.cell .mk{font-size:calc(var(--cellsz)*.42)}
.cell .mk.tocado{filter:drop-shadow(0 0 6px var(--foe))}
.cell .mk.visto{opacity:.75}
.cell .mk.old{opacity:.4}
.cell .dot{width:6px;height:6px;border-radius:50%;background:var(--muted);opacity:.6}
.cell .lbl{position:absolute;bottom:2px;right:3px;font-size:9px;color:var(--warn);font-family:var(--f-mono)}
.cell.f-atk::after{content:"";position:absolute;inset:0;background:var(--foe);opacity:0;animation:flash .9s ease-out}
.cell.f-hit::after{content:"";position:absolute;inset:0;background:#fff;opacity:0;animation:flash .9s ease-out 2}
.cell.f-scan::after{content:"";position:absolute;inset:0;background:var(--me);opacity:0;animation:flash .9s ease-out}
.cell.r-atk{box-shadow:inset 0 0 0 3px var(--foe)}
.cell.r-hit{background:color-mix(in srgb,var(--foe) 35%,var(--cell))}
.cell.dead .u{filter:grayscale(1);opacity:.35}
@keyframes flash{0%{opacity:.75}100%{opacity:0}}
@keyframes pulse{to{box-shadow:inset 0 0 0 2px transparent}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* log y panel */
.log{background:var(--surface);border-radius:10px;padding:8px 10px;font-size:13px;min-height:38px;display:flex;flex-direction:column;gap:3px}
.log p{margin:0}
.log .good{color:var(--ok)} .log .bad{color:var(--foe)} .log .info{color:var(--muted)} .log .warn{color:var(--warn)}
.panel{background:var(--surface);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.panel h3{margin:0;font-size:15px;display:flex;align-items:center;gap:6px}
.panel p{margin:0;font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--cell);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer}
.chip.set{border-color:var(--me)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--cell);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--me);border-color:var(--me);color:#06223a;font-weight:800}
.btn.danger{border-color:var(--foe);color:var(--foe)}
.btn.big{width:100%;padding:13px;font-size:16px;font-family:var(--f-display);letter-spacing:.05em;font-weight:400}

/* pantallas */
.hero{display:flex;flex-direction:column;gap:12px;padding-block:18px 4px}
.hero h1{font-family:var(--f-display);font-size:clamp(46px,16vw,72px);margin:0;line-height:.9;letter-spacing:.03em;text-wrap:balance}
.hero h1 b{color:var(--foe);font-weight:400}
.hero .tag{font-size:17px;margin:0;max-width:34ch}
.rules{background:var(--surface);border-radius:12px;padding:12px 14px}
.rules ol{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.rules h2{font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0}
.opts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.card.on{border-color:var(--me);background:color-mix(in srgb,var(--me) 10%,var(--surface))}
.card .ic{font-size:30px}
.card strong{font-size:15px}
.card small{color:var(--muted);font-size:12px;line-height:1.35}
.card .st{font-family:var(--f-mono);font-size:11px;color:var(--warn)}
.result{font-family:var(--f-display);font-size:30px;margin:0;line-height:1.05}
.result.win{color:var(--ok)} .result.lose{color:var(--foe)}
.replay{display:flex;flex-direction:column;gap:8px}
.rnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.rnav span{font-family:var(--f-mono);font-size:13px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
const N=5, COLS="ABCDE", D4=[[1,0],[-1,0],[0,1],[0,-1]];
const CH={
  arq:{n:"Arquera",i:"🏹",hp:2,cd:1,t:"enemy",d:"Dispara a una línea de 3 casillas. 1 de daño."},
  mon:{n:"Monstruo",i:"🐉",hp:3,cd:3,t:"enemy",d:"Bola de fuego 2×2. Cae el turno siguiente y el rival ve el aviso."},
  ase:{n:"Asesina",i:"🗡️",hp:1,cd:2,t:"enemy",d:"Golpea 1 casilla con 2 de daño. No deja huella."},
  exp:{n:"Exploradora",i:"🔭",hp:2,cd:1,t:"enemy",d:"Revela una zona 2×2 del tablero rival."},
  cab:{n:"Caballero",i:"🛡️",hp:3,cd:2,t:"self",d:"Escudo: él y los aliados de al lado no reciben daño este turno. No deja huella."},
  ilu:{n:"Ilusionista",i:"🎭",hp:2,cd:2,t:"own",d:"Señuelo: una huella falsa en tu tablero y un ataque falso al rival. No deja huella real."},
};
const TYPES=Object.keys(CH);
const MAX_TURNS=10;

const rnd=n=>Math.floor(Math.random()*n);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};
const key=(x,y)=>x+","+y;
const inB=(x,y)=>x>=0&&y>=0&&x<N&&y<N;
const ring=(x,y)=>Math.min(x,y,N-1-x,N-1-y);
const cname=(x,y)=>COLS[x]+(y+1);
const other=s=>s==="p"?"b":"p";
const clone=o=>JSON.parse(JSON.stringify(o));
const good=m=>({c:"good",m}), bad=m=>({c:"bad",m}), info=m=>({c:"info",m}), warn=m=>({c:"warn",m});

let G={phase:"menu",timerOpt:15,score:{p:0,b:0},round:0};
let timerId=null;

/* ---------- reglas ---------- */
const alive=s=>G.sides[s].units.filter(u=>u.alive);
const unitAt=(s,x,y)=>G.sides[s].units.find(u=>u.alive&&u.x===x&&u.y===y);
const isRock=(s,x,y)=>G.sides[s].rocks.has(key(x,y));
const isLava=(x,y)=>ring(x,y)<G.lava;
const nextLava=()=>G.turn===5?1:G.lava;
const lavaSoon=(x,y)=>!isLava(x,y)&&ring(x,y)<nextLava();
const incoming=(s)=>G.fireballs.filter(f=>f.t===s&&f.turn===G.turn);
const inArea=(cells,x,y)=>cells.some(([a,b])=>a===x&&b===y);

function areaOf(type,tx,ty){
  if(type==="arq"){const x0=Math.max(0,Math.min(tx-1,N-3));return [[x0,ty],[x0+1,ty],[x0+2,ty]];}
  if(type==="mon"||type==="exp"){const x0=Math.min(tx,N-2),y0=Math.min(ty,N-2);return [[x0,y0],[x0+1,y0],[x0,y0+1],[x0+1,y0+1]];}
  return [[tx,ty]];
}
function areaName(cells){
  if(cells.length===1)return cname(...cells[0]);
  return cname(...cells[0])+"–"+cname(...cells[cells.length-1]);
}
function validMoves(u){
  const s=u.side, range=alive(s).length===1?2:1;
  const res=[], seen=new Set([key(u.x,u.y)]); let fr=[[u.x,u.y]];
  for(let r=0;r<range;r++){
    const nf=[];
    for(const [x,y] of fr) for(const [dx,dy] of D4){
      const nx=x+dx, ny=y+dy, k=key(nx,ny);
      if(!inB(nx,ny)||seen.has(k))continue; seen.add(k);
      if(isRock(s,nx,ny)||isLava(nx,ny)||unitAt(s,nx,ny))continue;
      res.push([nx,ny]); nf.push([nx,ny]);
    }
    fr=nf;
  }
  return res;
}
function makeRocks(){
  const cells=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(ring(x,y)<2)cells.push([x,y]);
  return new Set(shuffle(cells).slice(0,2).map(c=>key(...c)));
}
function placeRandom(s,types){
  const free=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(!isRock(s,x,y))free.push([x,y]);
  const pos=shuffle(free);
  G.sides[s].units=types.map((t,i)=>({id:s+i,side:s,type:t,x:pos[i][0],y:pos[i][1],hp:CH[t].hp,max:CH[t].hp,cd:0,alive:true}));
}

/* ---------- flujo ---------- */
function newMatch(){G.score={p:0,b:0};G.round=0;startRound();}
function startRound(){
  G.round++; G.turn=0; G.lava=0; G.fireballs=[]; G.marks={p:[],b:[]}; G.dmg={p:0,b:0};
  G.history=[]; G.log=[]; G.fx=null; G.plan={}; G.sel=null; G.mode=null;
  G.sides={p:{units:[],rocks:makeRocks()},b:{units:[],rocks:makeRocks()}};
  placeRandom("b",shuffle(shuffle(TYPES).slice(0,4)).slice(0,3));
  G.offer=shuffle(TYPES).slice(0,4); G.pick=[];
  G.phase="draft"; render();
}
function confirmDraft(){
  placeRandom("p",G.pick.slice());
  G.phase="place"; G.sel=null; render();
}
function startBattle(){
  const bu=alive("b"), pu=alive("p");
  G.hint={p:bu[rnd(bu.length)].x,b:pu[rnd(pu.length)].x};
  G.log=[warn("Pista: hay un personaje rival en la columna "+COLS[G.hint.p]+".")];
  G.history.push(snapshot([]));
  beginTurn();
}
function beginTurn(){
  G.turn++;
  if(G.turn===6)G.lava=1;
  G.plan={}; G.sel=null; G.mode=null; G.fx=null; G.phase="plan";
  if(G.turn===5)G.log.push(warn("La lava avanza el próximo turno: sal de las casillas que parpadean."));
  startTimer(); render();
}
function startTimer(){
  clearInterval(timerId);
  if(!G.timerOpt){G.deadline=null;return;}
  G.deadline=Date.now()+G.timerOpt*1000;
  timerId=setInterval(()=>{
    const left=G.deadline-Date.now();
    const bar=document.querySelector(".timer"), sec=document.querySelector(".tsec");
    if(bar){bar.querySelector("i").style.width=Math.max(0,left/(G.timerOpt*1000)*100)+"%";bar.classList.toggle("low",left<3000);}
    if(sec)sec.textContent=Math.max(0,Math.ceil(left/1000))+"s";
    if(left<=0)submitTurn();
  },100);
}
function submitTurn(){
  if(G.phase!=="plan")return;
  clearInterval(timerId);
  G.phase="resolve";
  resolveTurn();
  G.plan={}; G.sel=null; G.mode=null;
  render();
  const pa=alive("p").length, ba=alive("b").length;
  setTimeout(()=>{
    if(pa===0||ba===0||G.turn>=MAX_TURNS)endRound();
    else beginTurn();
  },1500);
}
function snapshot(log){
  return {turn:G.turn,units:{p:clone(G.sides.p.units),b:clone(G.sides.b.units)},fx:G.fx?clone(G.fx):{p:[],b:[]},log:clone(log),lava:G.lava,
    fire:G.fireballs.map(f=>({...f}))};
}

/* ---------- resolución de un turno ---------- */
function resolveTurn(){
  const plans={p:G.plan,b:botPlan()};
  for(const s of ["p","b"])G.marks[s]=G.marks[s].map(m=>({...m,age:m.age+1})).filter(m=>m.age<=1);
  const fx={p:[],b:[]}, L=[], used=new Set();

  // 1. movimientos
  for(const s of ["p","b"]){
    for(const u of alive(s)){
      const a=plans[s][u.id];
      if(a&&a.k==="mv"&&!unitAt(s,a.x,a.y)&&!isRock(s,a.x,a.y)&&!isLava(a.x,a.y)){u.x=a.x;u.y=a.y;}
    }
  }
  // 2. escudos
  const shielded=new Set();
  for(const s of ["p","b"])for(const u of alive(s)){
    if(u.type==="cab"&&plans[s][u.id]&&plans[s][u.id].k==="ab"){
      used.add(u.id); shielded.add(u.id);
      for(const v of alive(s))if(Math.abs(v.x-u.x)+Math.abs(v.y-u.y)===1)shielded.add(v.id);
      if(s==="p")L.push(info("Tu Caballero levanta el escudo."));
    }
  }
  const hit=(att,cells,amount,src)=>{
    const d=other(att); let n=0;
    for(const [x,y] of cells){
      fx[d].push({x,y,c:"atk"});
      const v=unitAt(d,x,y); if(!v)continue; n++;
      if(shielded.has(v.id)){
        G.marks[d].push({t:"bloq",x,y,age:0});
        L.push(att==="p"?info("Bloqueado en "+cname(x,y)+": tenía escudo."):good("Tu escudo paró un ataque en "+cname(x,y)+"."));
        continue;
      }
      v.hp-=amount; G.dmg[att]+=amount;
      G.marks[d].push({t:"tocado",x,y,age:0,i:CH[v.type].i});
      fx[d].push({x,y,c:"hit"});
      L.push(att==="p"?good("¡Tocado en "+cname(x,y)+"! "+CH[v.type].i+" "+CH[v.type].n+" −"+amount)
                      :bad(CH[src].n+" rival dio a tu "+CH[v.type].n+" en "+cname(x,y)+" (−"+amount+")."));
    }
    return n;
  };
  // 3. bolas de fuego que caen este turno
  const landing=G.fireballs.filter(f=>f.turn===G.turn);
  G.fireballs=G.fireballs.filter(f=>f.turn!==G.turn);
  for(const f of landing){
    const n=hit(f.o,areaOf("mon",f.x,f.y),1,"mon");
    if(!n)L.push(f.o==="p"?info("Tu bola de fuego cayó en "+areaName(areaOf("mon",f.x,f.y))+": agua."):good("Esquivaste la bola de fuego."));
  }
  // 4. habilidades nuevas
  for(const s of ["p","b"]){
    const o=other(s);
    for(const u of alive(s)){
      const a=plans[s][u.id]; if(!a||a.k!=="ab"||u.type==="cab")continue;
      used.add(u.id);
      const huella=()=>G.marks[s].push({t:"huella",x:u.x,y:u.y,age:0});
      if(u.type==="arq"){
        const cells=areaOf("arq",a.x,a.y); const n=hit(s,cells,1,"arq"); huella();
        if(!n)L.push(s==="p"?info("Flecha a "+areaName(cells)+": agua."):info("Te lanzan una flecha a "+areaName(cells)+": falla."));
      }else if(u.type==="mon"){
        const c=areaOf("mon",a.x,a.y)[0];
        G.fireballs.push({o:s,t:o,x:c[0],y:c[1],turn:G.turn+1}); huella();
        L.push(s==="p"?info("Bola de fuego en camino a "+areaName(areaOf("mon",c[0],c[1]))+". Cae el próximo turno.")
                      :warn("¡Aviso! Bola de fuego sobre "+areaName(areaOf("mon",c[0],c[1]))+". Cae el próximo turno."));
      }else if(u.type==="ase"){
        const n=hit(s,[[a.x,a.y]],2,"ase");
        if(!n)L.push(s==="p"?info("Tu Asesina falla en "+cname(a.x,a.y)+"."):info("Algo golpea "+cname(a.x,a.y)+" y falla."));
      }else if(u.type==="exp"){
        const cells=areaOf("exp",a.x,a.y); let seen=0;
        for(const [x,y] of cells){
          const v=unitAt(o,x,y);
          G.marks[o].push(v?{t:"visto",x,y,age:0,i:CH[v.type].i}:{t:"vacio",x,y,age:0});
          if(v)seen++; fx[o].push({x,y,c:"scan"});
        }
        huella();
        L.push(s==="p"?(seen?good("Exploradora: "+seen+" personaje"+(seen>1?"s":"")+" a la vista."):info("Exploradora: zona "+areaName(cells)+" vacía."))
                      :info("La Exploradora rival ha mirado tu zona "+areaName(cells)+"."));
      }else if(u.type==="ilu"){
        G.marks[s].push({t:"huella",x:a.x,y:a.y,age:0,fake:true});
        const fy=rnd(N), f0=rnd(N-2), cells=[[f0,fy],[f0+1,fy],[f0+2,fy]];
        for(const [x,y] of cells)fx[o].push({x,y,c:"atk"});
        L.push(s==="p"?info("Señuelo en "+cname(a.x,a.y)+" y flecha falsa enviada."):info("Te lanzan una flecha a "+areaName(cells)+": falla."));
      }
    }
  }
  // 5. lava
  for(const s of ["p","b"])for(const u of alive(s))if(isLava(u.x,u.y)){
    u.hp-=1; fx[s].push({x:u.x,y:u.y,c:"hit"});
    L.push(s==="p"?bad("Tu "+CH[u.type].n+" se quema en la lava (−1)."):info("Un personaje rival se quema en la lava."));
  }
  // 6. bajas
  for(const s of ["p","b"])for(const u of alive(s))if(u.hp<=0){
    u.alive=false;
    L.push(s==="p"?bad("Has perdido a tu "+CH[u.type].n+"."):good("¡Eliminaste a "+CH[u.type].n+" rival!"));
  }
  // 7. recargas
  for(const s of ["p","b"])for(const u of G.sides[s].units){if(u.cd>0)u.cd--; if(used.has(u.id))u.cd=CH[u.type].cd;}

  if(!L.length)L.push(info("Turno tranquilo. Nadie ha atacado."));
  G.fx=fx; G.log=L;
  G.history.push(snapshot(L));
}

function endRound(){
  clearInterval(timerId);
  const pa=alive("p").length, ba=alive("b").length;
  let w=null, why="";
  if(pa===0&&ba===0){why="Caísteis los dos a la vez.";}
  else if(ba===0){w="p";why="Eliminaste a todo el equipo rival.";}
  else if(pa===0){w="b";why="El rival eliminó a todo tu equipo.";}
  else if(G.dmg.p!==G.dmg.b){w=G.dmg.p>G.dmg.b?"p":"b";why="Se acabó el tiempo. Daño hecho: tú "+G.dmg.p+", rival "+G.dmg.b+".";}
  else{
    const hp=s=>alive(s).reduce((a,u)=>a+u.hp,0);
    if(hp("p")!==hp("b")){w=hp("p")>hp("b")?"p":"b";why="Se acabó el tiempo con el mismo daño; gana quien tiene más vida.";}
    else why="Se acabó el tiempo y estáis empatados.";
  }
  if(w)G.score[w]++;
  G.roundWinner=w; G.roundWhy=why; G.replayIdx=G.history.length-1;
  G.matchOver=G.score.p>=2||G.score.b>=2||G.round>=5;
  G.phase="roundEnd"; render();
}

/* ---------- bot ---------- */
function botPlan(){
  const plan={}, reserved=new Set();
  const heat=Array.from({length:N},()=>Array(N).fill(0.15));
  const add=(x,y,w)=>{if(inB(x,y))heat[y][x]+=w;};
  for(const m of G.marks.p){
    const w=m.age===0?3:1.5;
    if(m.t==="huella"||m.t==="tocado"||m.t==="visto"){add(m.x,m.y,w);for(const [dx,dy] of D4)add(m.x+dx,m.y+dy,w*0.45);}
    if(m.t==="vacio"&&m.age===0)heat[m.y][m.x]*=0.3;
  }
  if(G.hint&&G.turn<=3)for(let y=0;y<N;y++)add(G.hint.b,y,0.8);
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){if(isRock("p",x,y))heat[y][x]=0;else if(isLava(x,y))heat[y][x]*=0.3;}
  const maxHeat=Math.max(...heat.flat());
  const best=type=>{
    let bs=-1,bt=[0,0];
    for(let y=0;y<N;y++)for(let x=0;x<N;x++){
      const sc=areaOf(type,x,y).reduce((a,[cx,cy])=>a+heat[cy][cx],0)+Math.random()*0.4;
      if(sc>bs){bs=sc;bt=[x,y];}
    }
    return {s:bs,t:bt};
  };
  const danger=(x,y)=>isLava(x,y)||lavaSoon(x,y)||incoming("b").some(f=>inArea(areaOf("mon",f.x,f.y),x,y));
  for(const u of shuffle(alive("b"))){
    const exposed=G.marks.b.some(m=>m.age===0&&m.x===u.x&&m.y===u.y&&((m.t==="huella"&&!m.fake)||m.t==="tocado"||m.t==="visto"));
    const moves=validMoves(u).filter(([x,y])=>!reserved.has(key(x,y)));
    const safe=moves.filter(([x,y])=>!danger(x,y));
    const go=pool=>{const [x,y]=pool[rnd(pool.length)];plan[u.id]={k:"mv",x,y};reserved.add(key(x,y));};
    if(danger(u.x,u.y)||(exposed&&Math.random()<0.7)){
      const pool=safe.length?safe:moves;
      if(pool.length){go(pool);continue;}
    }
    if(u.cd===0){
      let use=false,t=null;
      if(u.type==="cab")use=alive("b").some(v=>v!==u&&Math.abs(v.x-u.x)+Math.abs(v.y-u.y)===1)&&Math.random()<0.5;
      else if(u.type==="ilu"){use=Math.random()<0.4;t=[rnd(N),rnd(N)];if(isRock("b",t[0],t[1]))use=false;}
      else if(u.type==="exp"){use=maxHeat<2||Math.random()<0.3;t=[rnd(N-1),rnd(N-1)];}
      else{const b=best(u.type);use=b.s>(u.type==="ase"?1.2:0.9)||Math.random()<0.5;t=b.t;}
      if(use){plan[u.id]={k:"ab",x:t?t[0]:u.x,y:t?t[1]:u.y};continue;}
    }
    if(safe.length&&Math.random()<0.45)go(safe);
  }
  return plan;
}

/* ---------- interfaz ---------- */
const $app=document.getElementById("app");
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function header(){
  const sc=G.phase==="menu"?"":`<div class="score"><span class="me">Tú ${G.score.p}</span><span>–</span><span class="foe">${G.score.b} Bot</span></div>`;
  return `<div class="top"><p class="logo">AMA<b>GO</b></p>${sc}</div>`;
}

function render(){
  let h=header();
  if(G.phase==="menu")h+=menuView();
  else if(G.phase==="draft")h+=draftView();
  else if(G.phase==="roundEnd")h+=roundEndView();
  else h+=gameView();
  $app.innerHTML=h;
  if(G.phase==="plan"&&G.deadline){
    const left=G.deadline-Date.now(), bar=document.querySelector(".timer");
    if(bar)bar.querySelector("i").style.width=Math.max(0,left/(G.timerOpt*1000)*100)+"%";
  }
}

function draftView(){
  const cards=G.offer.map(t=>{

function boardHTML(id,cellFn){
  let h=`<div class="board" id="${id}"><span></span>`;
  for(let x=0;x<N;x++)h+=`<span class="hdr">${COLS[x]}</span>`;
  for(let y=0;y<N;y++){
    h+=`<span class="hdr">${y+1}</span>`;
    for(let x=0;x<N;x++){const c=cellFn(x,y);h+=`<button class="cell ${c.cls||""}" data-b="${id}" data-x="${x}" data-y="${y}" aria-label="${cname(x,y)}">${c.html||""}</button>`;}
  }
  return h+"</div>";
}
const hpPips=u=>`<span class="hp">${Array.from({length:u.max},(_,i)=>`<i class="${i<u.hp?"":"off"}"></i>`).join("")}</span>`;

function plannedAreas(){
  const out=[];
  for(const u of alive("p")){
    const a=G.plan[u.id];
    if(a&&a.k==="ab"&&CH[u.type].t==="enemy")out.push({u,cells:areaOf(u.type,a.x,a.y)});
  }
  return out;
}
function selUnit(){return G.sel?G.sides.p.units.find(u=>u.id===G.sel&&u.alive):null;}
function moveOptions(u){
  const taken=new Set(Object.entries(G.plan).filter(([id,a])=>id!==u.id&&a.k==="mv").map(([,a])=>key(a.x,a.y)));
  return validMoves(u).filter(([x,y])=>!taken.has(key(x,y)));
}

function enemyCell(x,y){
  const cls=[], parts=[];
  const fxOn=G.phase==="resolve"&&G.fx;
  if(isRock("b",x,y))cls.push("rock");
  if(isLava(x,y))cls.push("lava");else if(lavaSoon(x,y))cls.push("lavasoon");
  if(G.hint&&G.turn<=2&&x===G.hint.p)cls.push("hintcol");
  if(incoming("b").some(f=>f.o==="p"&&inArea(areaOf("mon",f.x,f.y),x,y))){cls.push("fbmine");parts.push(`<span class="lbl">🔥</span>`);}
  for(const pa of plannedAreas())if(inArea(pa.cells,x,y)){cls.push("area");parts.push(`<span class="lbl">${pa.u.type==="mon"?"🔥":CH[pa.u.type].i}</span>`);}
  const su=selUnit();
  if(G.phase==="plan"&&su&&G.mode==="target"&&!isRock("b",x,y))cls.push("tgt");
  const ms=G.marks.b.filter(m=>m.x===x&&m.y===y);
  const top=ms.find(m=>m.t==="tocado")||ms.find(m=>m.t==="visto")||ms.find(m=>m.t==="bloq")||ms.find(m=>m.t==="huella")||ms.find(m=>m.t==="vacio");
  if(top){
    const old=top.age>0?" old":"";
    if(top.t==="huella")parts.unshift(`<span class="huella${old}" title="Huella"></span>`);
    else if(top.t==="tocado")parts.unshift(`<span class="mk tocado${old}">${top.i}</span>`);
    else if(top.t==="visto")parts.unshift(`<span class="mk visto${old}">${top.i}</span>`);
    else if(top.t==="bloq")parts.unshift(`<span class="mk${old}">🛡️</span>`);
    else parts.unshift(`<span class="dot"></span>`);
  }
  if(fxOn)for(const f of G.fx.b)if(f.x===x&&f.y===y)cls.push("f-"+f.c);
  return {cls:cls.join(" "),html:parts.join("")};
}

function myCell(x,y){
  const cls=[], parts=[];
  const fxOn=G.phase==="resolve"&&G.fx;
  if(isRock("p",x,y))cls.push("rock");
  if(isLava(x,y))cls.push("lava");else if(lavaSoon(x,y))cls.push("lavasoon");
  if(incoming("p").some(f=>inArea(areaOf("mon",f.x,f.y),x,y)))cls.push("fbwarn");
  const u=unitAt("p",x,y), su=selUnit();
  if(u){
    const a=G.plan[u.id];
    parts.push(`<span class="u">${CH[u.type].i}</span>`+hpPips(u));
    if(u.cd>0)parts.push(`<span class="cd">⏳${u.cd}</span>`);
    if(a&&a.k==="mv")cls.push("leaving");
    if(a&&a.k==="ab")parts.push(`<span class="act">⚔️</span>`);
    if(su&&su.id===u.id)cls.push("sel");
  }
  for(const [id,a] of Object.entries(G.plan)){
    if(a.k==="mv"&&a.x===x&&a.y===y){const v=G.sides.p.units.find(w=>w.id===id);cls.push("dest");parts.push(`<span class="ghost">${CH[v.type].i}</span>`);}
    if(a.k==="ab"&&a.x===x&&a.y===y&&G.sides.p.units.find(w=>w.id===id).type==="ilu")parts.push(`<span class="lbl">🎭</span>`);
  }
  if(G.marks.p.some(m=>m.t==="huella"&&m.x===x&&m.y===y))parts.push(`<span class="exposed" title="El rival ve una huella aquí"></span>`);
  if(G.phase==="place"&&su&&!u&&!isRock("p",x,y))cls.push("hl");
  if(G.phase==="plan"&&su&&G.mode==="move"&&moveOptions(su).some(([a,b])=>a===x&&b===y))cls.push("hl");
  if(G.phase==="plan"&&su&&G.mode==="decoy"&&!isRock("p",x,y))cls.push("tgt");
  if(fxOn)for(const f of G.fx.p)if(f.x===x&&f.y===y)cls.push("f-"+f.c);
  return {cls:cls.join(" "),html:parts.join("")};
}

function actionText(u){
  const a=G.plan[u.id];
  if(!a)return "quieto";
  if(a.k==="mv")return "→ "+cname(a.x,a.y);
  if(u.type==="cab")return "escudo";
  if(u.type==="ilu")return "señuelo "+cname(a.x,a.y);
  if(u.type==="mon")return "fuego "+areaName(areaOf("mon",a.x,a.y));
  return "ataca "+areaName(areaOf(u.type,a.x,a.y));
}

function panelView(){
  if(G.phase==="place"){
    return `<div class="panel"><h3>Coloca a tu equipo</h3>
      <p>Toca un personaje y luego una casilla libre para moverlo. El rival no verá dónde los pones.</p>
      <button class="btn primary big" data-act="battle">¡A jugar!</button></div>`;
  }
  if(G.phase==="resolve")return `<div class="panel"><p>Resolviendo el turno…</p></div>`;
  const su=selUnit();
  if(su){
    const c=CH[su.type], ready=su.cd===0;
    let abBtn="";
    if(c.t==="self")abBtn=`<button class="btn ${G.plan[su.id]&&G.plan[su.id].k==="ab"?"primary":""}" data-act="shield" ${ready?"":"disabled"}>Escudo</button>`;
    else if(c.t==="own")abBtn=`<button class="btn ${G.mode==="decoy"?"primary":""}" data-act="decoy" ${ready?"":"disabled"}>Señuelo</button>`;
    else abBtn=`<button class="btn ${G.mode==="target"?"primary":""}" data-act="target" ${ready?"":"disabled"}>Atacar</button>`;
    let hint;
    if(!ready)hint="Recargando: podrá usar su habilidad en "+su.cd+" turno"+(su.cd>1?"s":"")+".";
    else if(G.mode==="target")hint="Toca una casilla del tablero rival.";
    else if(G.mode==="decoy")hint="Toca una casilla de tu tablero para poner la huella falsa.";
    else hint="Toca una casilla azul para moverte, o usa su habilidad.";
    return `<div class="panel"><h3>${c.i} ${c.n} <span style="font-weight:400;color:var(--muted);font-size:13px">· ${actionText(su)}</span></h3>
      <p>${c.d}</p><p style="color:var(--fg)">${hint}</p>
      <div class="row"><button class="btn ${G.mode==="move"?"primary":""}" data-act="move">Mover</button>${abBtn}
      <button class="btn" data-act="stay">Quieto</button><button class="btn" data-act="desel">Hecho</button></div></div>`;
  }
  const chips=alive("p").map(u=>`<button class="chip ${G.plan[u.id]?"set":""}" data-act="sel" data-id="${u.id}">${CH[u.type].i} ${actionText(u)}</button>`).join("");
  return `<div class="panel"><p>Toca uno de tus personajes para darle una orden.</p><div class="chips">${chips}</div>
    <button class="btn primary big" data-act="ready">Listo</button></div>`;
}

function gameView(){
  const timer=G.phase==="plan"&&G.timerOpt?`<div class="timer"><i></i></div><span class="tsec">${G.timerOpt}s</span>`:`<span style="flex:1"></span>`;
  const turnTxt=G.phase==="place"?"Colocación":"Turno "+G.turn+"/"+MAX_TURNS;
  const log=G.phase==="place"?`<div class="log"><p class="info">Tu tablero es el de abajo. El de arriba es el del rival, oculto.</p></div>`
    :`<div class="log">${G.log.map(l=>`<p class="${l.c}">${esc(l.m)}</p>`).join("")}</div>`;
  const shake=G.phase==="resolve"&&G.fx&&G.fx.p.some(f=>f.c==="hit")?"shake":"";
  return `<div class="hud"><strong>Ronda ${G.round}</strong><span>${turnTxt}</span>${timer}</div>
    <div class="boardwrap"><div class="blabel foe"><span>Tablero rival</span><span>${alive("b").length} vivos</span></div>${boardHTML("e",enemyCell)}</div>
    ${log}
    <div class="boardwrap ${shake}">${boardHTML("m",myCell)}<div class="blabel me"><span>Tu tablero</span><span>Daño hecho: ${G.dmg.p}</span></div></div>
    ${panelView()}`;
}

function roundEndView(){
  const snap=G.history[G.replayIdx];
  const w=G.roundWinner;
  const title=w==="p"?"Ronda para ti":w==="b"?"Ronda para el bot":"Ronda empatada";
  const cellFor=s=>(x,y)=>{
    const cls=[],parts=[];
    if(G.sides[s].rocks.has(key(x,y)))cls.push("rock");
    if(ring(x,y)<snap.lava)cls.push("lava");
    const u=snap.units[s].find(v=>v.x===x&&v.y===y&&(v.alive||v.hp<=0));
    const live=snap.units[s].find(v=>v.alive&&v.x===x&&v.y===y);
    const shown=live||u;
    if(shown){parts.push(`<span class="u">${CH[shown.type].i}</span>`+hpPips({...shown,hp:Math.max(0,shown.hp)}));if(!live)cls.push("dead");}
    for(const f of snap.fx[s]||[])if(f.x===x&&f.y===y)cls.push(f.c==="hit"?"r-hit":"r-atk");
    return {cls:cls.join(" "),html:parts.join("")};
  };
  const over=G.matchOver;
  const final=over?(G.score.p>G.score.b?"¡Has ganado la partida!":G.score.p<G.score.b?"El bot gana la partida":"Partida empatada"):"";
  return `<div><p class="result ${w==="p"?"win":w==="b"?"lose":""}">${title}</p><p style="color:var(--muted);margin:6px 0 0">${esc(G.roundWhy)}</p>
      ${over?`<p class="result" style="font-size:22px;margin-top:10px">${final}</p>`:""}</div>
    <div class="replay">
      <div class="rnav"><button class="btn" data-act="rprev" ${G.replayIdx>0?"":"disabled"}>◀</button>
        <span>Repetición · ${snap.turn===0?"inicio":"turno "+snap.turn}</span>
        <button class="btn" data-act="rnext" ${G.replayIdx<G.history.length-1?"":"disabled"}>▶</button></div>
      <div class="boardwrap"><div class="blabel foe"><span>Rival al descubierto</span></div>${boardHTML("rb",cellFor("b"))}</div>
      <div class="log">${(snap.log.length?snap.log:[info("Posiciones iniciales.")]).map(l=>`<p class="${l.c}">${esc(l.m)}</p>`).join("")}</div>
      <div class="boardwrap">${boardHTML("rp",cellFor("p"))}<div class="blabel me"><span>Tu equipo</span></div></div>
    </div>
    <button class="btn primary big" data-act="${over?"again":"next"}">${over?"Nueva partida":"Siguiente ronda"}</button>
    ${over?`<button class="btn" data-act="menu">Volver al inicio</button>`:""}`;
}

/* ---------- eventos ---------- */
$app.addEventListener("click",e=>{
  const el=e.target.closest("[data-act],[data-b]"); if(!el)return;
  const act=el.dataset.act;
  if(el.dataset.b){onCell(el.dataset.b,+el.dataset.x,+el.dataset.y);return;}
  const su=selUnit();
  switch(act){
    case "timer":G.timerOpt=+el.dataset.v;render();break;
    case "start":case "again":newMatch();break;
    case "menu":G.phase="menu";render();break;
    case "pick":{const t=el.dataset.t;const i=G.pick.indexOf(t);if(i>=0)G.pick.splice(i,1);else if(G.pick.length<3)G.pick.push(t);render();break;}
    case "draftok":if(G.pick.length===3)confirmDraft();break;
    case "battle":G.sel=null;startBattle();break;
    case "ready":submitTurn();break;
    case "sel":G.sel=el.dataset.id;G.mode="move";render();break;
    case "desel":G.sel=null;G.mode=null;render();break;
    case "move":G.mode="move";render();break;
    case "target":if(su&&su.cd===0){G.mode="target";render();}break;
    case "decoy":if(su&&su.cd===0){G.mode="decoy";render();}break;
    case "shield":if(su&&su.cd===0){if(G.plan[su.id]&&G.plan[su.id].k==="ab")delete G.plan[su.id];else G.plan[su.id]={k:"ab",x:su.x,y:su.y};G.sel=null;G.mode=null;render();}break;
    case "stay":if(su){delete G.plan[su.id];G.sel=null;G.mode=null;render();}break;
    case "rprev":G.replayIdx=Math.max(0,G.replayIdx-1);render();break;
    case "rnext":G.replayIdx=Math.min(G.history.length-1,G.replayIdx+1);render();break;
    case "next":startRound();break;
  }
});

function onCell(b,x,y){
  if(G.phase==="place"&&b==="m"){
    const u=unitAt("p",x,y);
    if(u){G.sel=u.id;render();return;}
    const su=selUnit();
    if(su&&!isRock("p",x,y)){su.x=x;su.y=y;G.sel=null;render();}
    return;
  }
  if(G.phase!=="plan")return;
  const su=selUnit();
  if(b==="m"){
    const u=unitAt("p",x,y);
    if(su&&G.mode==="decoy"&&!isRock("p",x,y)){G.plan[su.id]={k:"ab",x,y};G.sel=null;G.mode=null;render();return;}
    if(su&&G.mode==="move"&&moveOptions(su).some(([a,c])=>a===x&&c===y)){G.plan[su.id]={k:"mv",x,y};G.sel=null;G.mode=null;render();return;}
    if(u){G.sel=u.id;G.mode="move";render();return;}
    return;
  }
  if(b==="e"&&su&&CH[su.type].t==="enemy"&&su.cd===0&&!isRock("b",x,y)){
