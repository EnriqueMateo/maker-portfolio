<!doctype html><html><head><meta charset="utf-8"><title>Ojo 3D</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#8fd0ff}canvas{display:block}
#lab{position:fixed;left:0;right:0;bottom:7%;text-align:center;font:900 44px system-ui;color:#fff;-webkit-text-stroke:3px #1a1030;paint-order:stroke;letter-spacing:1px}</style></head><body>
<div id="lab"></div>
<script src="../../amago/vendor/three.min.js"></script>
<script>
/* Ojo 3D (modelo generado desde su ilustración) con animación procedural: respira, aletea, salta, ataca, recibe y celebra */
const T=THREE,Q=new URLSearchParams(location.search),SRC=Q.get("m")||"ojo.glb";
const R=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});R.setPixelRatio(Math.min(2,devicePixelRatio));R.setSize(innerWidth,innerHeight);R.outputColorSpace=T.SRGBColorSpace;document.body.appendChild(R.domElement);
const sc=new T.Scene();
{const c=document.createElement("canvas");c.width=4;c.height=512;const g=c.getContext("2d"),gr=g.createLinearGradient(0,0,0,512);gr.addColorStop(0,"#2f7cff");gr.addColorStop(.55,"#8fd3ff");gr.addColorStop(1,"#d8f3ff");g.fillStyle=gr;g.fillRect(0,0,4,512);const t=new T.CanvasTexture(c);t.colorSpace=T.SRGBColorSpace;sc.background=t;}
const cam=new T.PerspectiveCamera(32,innerWidth/innerHeight,.05,100);
/* isla */
const isl=new T.Mesh(new T.CylinderGeometry(1.25,1.25,.14,64),new T.MeshBasicMaterial({color:0x7fd34e}));isl.position.y=-.07;sc.add(isl);
const lip=new T.Mesh(new T.TorusGeometry(1.25,.06,10,80),new T.MeshBasicMaterial({color:0x5fb83a}));lip.rotation.x=Math.PI/2;lip.position.y=-.01;sc.add(lip);
const soil=new T.Mesh(new T.CylinderGeometry(1.27,.6,.9,40),new T.MeshBasicMaterial({color:0xc08a52}));soil.position.y=-.59;sc.add(soil);
const shTex=(()=>{const c=document.createElement("canvas");c.width=c.height=128;const g=c.getContext("2d"),q=g.createRadialGradient(64,64,0,64,64,64);q.addColorStop(0,"rgba(20,50,10,.45)");q.addColorStop(1,"rgba(20,50,10,0)");g.fillStyle=q;g.fillRect(0,0,128,128);return new T.CanvasTexture(c);})();
const blob=new T.Mesh(new T.PlaneGeometry(.9,.6),new T.MeshBasicMaterial({map:shTex,transparent:true,depthWrite:false}));blob.rotation.x=-Math.PI/2;blob.position.y=.003;sc.add(blob);
/* uniforms de la animación procedural */
const U={uFlap:{value:0},uSpread:{value:0},uFlash:{value:0},uL:{value:new T.Vector3(-.35,.8,.6).normalize()},uWX:{value:.2},uSh:{value:new T.Vector3()}};
function mat(map,col){
  const m=new T.MeshBasicMaterial({map:map||null,color:col||0xffffff,toneMapped:false});
  m.onBeforeCompile=s=>{Object.assign(s.uniforms,U);
    s.vertexShader="uniform float uFlap,uSpread,uWX;uniform vec3 uSh;varying vec3 vKN;varying vec3 vKV;\n"+s.vertexShader
     .replace("#include <begin_vertex>",`#include <begin_vertex>
vec3 kn=normal;
{/* alas: lo que sobresale a los lados gira alrededor del hombro */
 float ax=abs(transformed.x),sd=sign(transformed.x);
 float w=smoothstep(uWX,uWX+.12,ax)*smoothstep(.12,.32,transformed.y)*(1.-smoothstep(.62,.8,transformed.y));
 float a=(uFlap+uSpread)*w*sd;vec2 p=vec2(transformed.x-sd*uWX,transformed.y-uSh.y);
 float c=cos(a),s=sin(a);p=vec2(c*p.x-s*p.y,s*p.x+c*p.y);transformed.x=p.x+sd*uWX;transformed.y=p.y+uSh.y;
 vec2 nn=vec2(c*kn.x-s*kn.y,s*kn.x+c*kn.y);kn.xy=nn;}`)
     .replace("#include <fog_vertex>","#include <fog_vertex>\nvKN=normalize(mat3(modelMatrix)*kn);vKV=normalize(cameraPosition-(modelMatrix*vec4(transformed,1.)).xyz);");
    s.fragmentShader="varying vec3 vKN;varying vec3 vKV;uniform vec3 uL;uniform float uFlash;\n"+s.fragmentShader.replace("#include <map_fragment>",`#include <map_fragment>
{vec3 N=normalize(vKN);if(!gl_FrontFacing)N=-N;vec3 V=normalize(vKV);vec3 b=diffuseColor.rgb;float lg=dot(b,vec3(.299,.587,.114));b=max(mix(vec3(lg),b,1.18),0.);
 float lit=smoothstep(-.2,.35,dot(N,uL));vec3 c=mix(b*vec3(.72,.74,.95),b*1.08,lit);
 float rim=pow(1.-clamp(dot(N,V),0.,1.),3.);c+=vec3(1.,.95,.85)*rim*.35*smoothstep(-.2,.5,N.y);
 diffuseColor.rgb=mix(c,vec3(1.),uFlash);}`);};
  return m;
}
const L=new T.GLTFLoader();let root=null,body=null,H=1;
L.load(SRC,g=>{
  const m=g.scene;m.updateMatrixWorld(true);
  /* pasa todo a una sola geometría en espacio del modelo para deformarla */
  m.traverse(o=>{if(o.isMesh){o.geometry=o.geometry.clone().applyMatrix4(o.matrixWorld);o.position.set(0,0,0);o.rotation.set(0,0,0);o.scale.set(1,1,1);o.updateMatrix();
    if(!o.geometry.attributes.normal)o.geometry.computeVertexNormals();o.material=mat(o.material.map,o.material.map?null:o.material.color);o.frustumCulled=false;}});
  const meshes=[];m.traverse(o=>{if(o.isMesh)meshes.push(o);});
  const box=new T.Box3();meshes.forEach(o=>{o.geometry.computeBoundingBox();box.union(o.geometry.boundingBox);});
  const sz=box.getSize(new T.Vector3()),k=1/sz.y,cx=(box.min.x+box.max.x)/2,cz=(box.min.z+box.max.z)/2;
  meshes.forEach(o=>{o.geometry.translate(-cx,-box.min.y,-cz);o.geometry.scale(k,k,k);});
  U.uWX.value=+(Q.get("wx")||.23)*sz.x*k;U.uSh.value.set(0,+(Q.get("sh")||.5),0);
  root=new T.Group();body=new T.Group();meshes.forEach(o=>body.add(o));root.add(body);sc.add(root);
  document.title="ready";
});
/* contorno de silueta continuo (igual que en el juego) */
const RT=new T.WebGLRenderTarget(1,1,{samples:4}),mask=new T.MeshBasicMaterial({color:0xffffff});
const qs=new T.Scene(),qc=new T.OrthographicCamera(-1,1,1,-1,0,1),qm=new T.ShaderMaterial({transparent:true,depthTest:false,depthWrite:false,uniforms:{tM:{value:RT.texture},px:{value:new T.Vector2()},rad:{value:4}},
 vertexShader:"varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}",
 fragmentShader:`uniform sampler2D tM;uniform vec2 px;uniform float rad;varying vec2 vUv;void main(){float c=texture2D(tM,vUv).r;if(c>.99)discard;float m=0.;
 for(int i=0;i<16;i++){float a=float(i)*.392699;vec2 o=vec2(cos(a),sin(a))*px*rad;m=max(m,texture2D(tM,vUv+o).r);m=max(m,texture2D(tM,vUv+o*.55).r);}
 float al=clamp(m-c,0.,1.);if(al<.02)discard;gl_FragColor=vec4(vec3(.1,.06,.19),al);}`});qs.add(new T.Mesh(new T.PlaneGeometry(2,2),qm));
function draw(){
  const v=new T.Vector2();R.getDrawingBufferSize(v);if(RT.width!==v.x||RT.height!==v.y)RT.setSize(v.x,v.y);
  R.setRenderTarget(null);R.autoClear=true;R.render(sc,cam);
  if(!root)return;const vis=[];sc.children.forEach(o=>{if(o!==root){vis.push([o,o.visible]);o.visible=false;}});
  const bg=sc.background;sc.background=null;sc.overrideMaterial=mask;R.setRenderTarget(RT);R.setClearColor(0,1);R.clear();R.render(sc,cam);R.setRenderTarget(null);
  sc.overrideMaterial=null;sc.background=bg;vis.forEach(([o,s])=>o.visible=s);
  qm.uniforms.px.value.set(1/v.x,1/v.y);qm.uniforms.rad.value=2.6*R.getPixelRatio();R.autoClear=false;R.render(qs,qc);R.autoClear=true;
}
/* guion del vídeo */
const SEQ=[["QUIETO",0,3],["ANDA",3,6],["ATACA",6,8],["¡AY!",8,9.4],["¡GANA!",9.4,12]];
const ease=t=>t*t*(3-2*t),cl=t=>Math.max(0,Math.min(1,t));
window.at=function(t){
  if(!root){return;}
  const lab=SEQ.find(s=>t>=s[1]&&t<s[2])||SEQ[SEQ.length-1],k=t-lab[1];document.getElementById("lab").textContent=lab[0];
  let y=0,sx=1,sy=1,rx=0,ry=.45+Math.sin(t*.6)*.18,rz=0,flap=0,spread=0,flash=0,px=0;
  const br=Math.sin(t*2.4);sy=1+.025*br;sx=1-.015*br;flap=.06*Math.sin(t*2.4+.6);
  if(lab[0]==="ANDA"){const ph=k*2.6*Math.PI,hop=Math.abs(Math.sin(ph));y=.14*hop;sy=1+.08*hop-.1*(1-hop)*(1-hop);sx=1/Math.sqrt(sy);rz=.12*Math.sin(ph);px=Math.sin(k*1.05)*.45;ry=Math.cos(k*1.05)>0?1.3:-1.3;flap=.35*Math.sin(ph*2);}
  if(lab[0]==="ATACA"){const u=cl(k/1.1),wind=u<.35?ease(u/.35):0,hit=u>=.35?1-ease((u-.35)/.65):0;rx=-.25*wind+.45*hit;spread=-.5*wind+.9*hit;sy=1-.08*wind+.06*hit;ry=.2;y=.05*hit;}
  if(lab[0]==="¡AY!"){const e=Math.sin(Math.min(1,k*1.6)*Math.PI);flash=k<.12?.8:0;rx=-.3*e;sy=1-.14*e;sx=1+.1*e;rz=.15*Math.sin(k*40)*(1-cl(k));spread=.4*e;ry=.3;}
  if(lab[0]==="¡GANA!"){const ph=k*3.2*Math.PI,j=Math.max(0,Math.sin(ph));y=.22*j;sy=1+.1*j-.08*(1-j);flap=.8*Math.sin(k*22);spread=.5;ry=.3+k*.9;}
  U.uFlap.value=flap;U.uSpread.value=spread;U.uFlash.value=flash;
  root.position.set(px,0,0);root.rotation.y=ry;body.position.y=y;body.rotation.set(rx,0,rz);body.scale.set(sx,sy,sx);
  blob.position.x=px;blob.scale.setScalar(1-Math.min(.5,y*1.8));
  cam.aspect=innerWidth/innerHeight;cam.position.set(0,1.25,4.3);cam.lookAt(0,.5,0);cam.updateProjectionMatrix();
  draw();
};
if(!Q.has("rec")){const t0=performance.now();(function loop(){requestAnimationFrame(loop);at(((performance.now()-t0)/1000)%12);})();}
</script></body></html>
