<!doctype html><html><head><meta charset="utf-8"><title>sheet</title>
<style>html,body{margin:0;background:#8fd0ff}canvas{display:block}.l{position:absolute;color:#000;font:700 14px system-ui}</style></head><body>
<script src="../../amago/vendor/three.min.js"></script>
<script>
const T=THREE,Q=new URLSearchParams(location.search),DIR=Q.get("d")||"../vendor/quat/sel/",F=(Q.get("f")||"").split(","),C=+(Q.get("c")||5),S=+(Q.get("s")||220),ANG=+(Q.get("a")||.5);

(async()=>{

  const cam=new T.PerspectiveCamera(30,1,.01,1000);cam.position.set(c.x+Math.sin(ANG)*r*2.2,c.y+r*.5,c.z+Math.cos(ANG)*r*2.2);cam.lookAt(c);

 }
 document.title="done";
})();
</script></body></html>
