# Compila AMAGO para Android (AAB firmado) y lo sube a la pista de prueba interna de Google Play.
# Se lanza al subir una etiqueta amago-android-v1.0.0 (la versión sale de la etiqueta) o a mano desde Actions.
# Necesita en el repo (Settings → Secrets and variables → Actions):
#   secretos: ANDROID_KEYSTORE_BASE64 (el .jks en base64), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
#             ANDROID_KEY_PASSWORD y, para subir solo, PLAY_SERVICE_ACCOUNT_JSON (si falta, deja el AAB para descargar)
#   variable: AMAGO_SERVER (https://… del servidor en Railway)
name: AMAGO Android → Google Play

on:
  push:
    tags: ["amago-android-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versión (ej. 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: read

concurrency:
  group: amago-android
  cancel-in-progress: false

jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: amago/app
    env:
      AMAGO_SERVER: ${{ vars.AMAGO_SERVER }}
      INPUT_VERSION: ${{ inputs.version }}
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
      HAS_KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Versión y número de compilación
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then V="${GITHUB_REF_NAME#amago-android-v}"; else V="$INPUT_VERSION"; fi
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::Versión no válida: $V (usa 1.2.3)"; exit 1; fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "BUILD=$(( GITHUB_RUN_NUMBER + 100 ))" >> "$GITHUB_ENV"

      - name: Comprobar configuración
        run: |
          if [ -z "$AMAGO_SERVER" ]; then echo "::error::Falta la variable AMAGO_SERVER"; exit 1; fi
          if [ "$HAS_KS" != "true" ]; then echo "::warning::Sin keystore: se compila un AAB sin firmar (sirve para comprobar, no para Google Play)"; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preparar el juego dentro de la app
        run: |
          npm ci
          npm run www
          npx cap sync android

      - name: Keystore de subida
        if: ${{ env.HAS_KS == 'true' }}
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/ks"
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/ks/upload.jks"
          echo "AMAGO_KEYSTORE=$RUNNER_TEMP/ks/upload.jks" >> "$GITHUB_ENV"

      - name: Compilar AAB firmado
        working-directory: amago/app/android
        env:
          AMAGO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AMAGO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          AMAGO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease -PversionCode="$BUILD" -PversionName="$VERSION" --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: amago-${{ env.VERSION }}-${{ env.BUILD }}.aab
          path: amago/app/android/app/build/outputs/bundle/release/app-release.aab

      - name: Subir a Google Play (prueba interna)
        if: ${{ env.HAS_PLAY == 'true' && env.HAS_KS == 'true' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.enriquemateo.amago
          releaseFiles: amago/app/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: draft

      - name: Borrar el keystore
        if: always()
        run: rm -rf "$RUNNER_TEMP/ks"
